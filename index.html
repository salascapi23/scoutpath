/* ============================ HANDLERS ============================ */
function attachHandlers(){
  // LOGIN
  document.querySelectorAll('[data-loginmode]').forEach(b=>{
    b.onclick = ()=>{ state.loginMode=b.dataset.loginmode; state.loginError=null; render(); };
  });
  const btnIrRecover = document.getElementById('btn-ir-recover');
  if(btnIrRecover) btnIrRecover.onclick = (e)=>{ e.preventDefault(); state.loginMode='recover'; state.recoverStep='pedir'; state.loginError=null; state.loginInfo=null; render(); };
  const btnRecoverVolver = document.getElementById('btn-recover-volver');
  if(btnRecoverVolver) btnRecoverVolver.onclick = (e)=>{ e.preventDefault(); state.loginMode='signin'; state.recoverStep=null; state.recoverEmail=null; state.loginError=null; state.loginInfo=null; render(); };
  const btnRecoverSend = document.getElementById('btn-recover-send');
  if(btnRecoverSend) btnRecoverSend.onclick = async ()=>{
    const email = (document.getElementById('recover-email').value||'').trim();
    if(!email){ state.loginError='Escribe tu email.'; render(); return; }
    btnRecoverSend.disabled = true; btnRecoverSend.textContent='Enviando...';
    try{
      await authSolicitarCodigo(email);
      state.recoverEmail = email; state.recoverStep = 'codigo'; state.loginError = null;
      state.loginInfo = 'Código enviado. Revisa tu correo (y la carpeta de spam).';
      render();
    }catch(e){ state.loginError = e.message || 'No se pudo enviar el código.'; state.loginInfo=null; render(); }
  };
  const btnRecoverReenviar = document.getElementById('btn-recover-reenviar');
  if(btnRecoverReenviar) btnRecoverReenviar.onclick = async ()=>{
    try{ await authSolicitarCodigo(state.recoverEmail); state.loginInfo='Código reenviado.'; state.loginError=null; render(); }
    catch(e){ state.loginError = e.message || 'No se pudo reenviar el código.'; render(); }
  };
  const btnRecoverConfirm = document.getElementById('btn-recover-confirm');
  if(btnRecoverConfirm) btnRecoverConfirm.onclick = async ()=>{
    const codigo = (document.getElementById('recover-code').value||'').trim();
    const nuevaPass = document.getElementById('recover-new-password').value||'';
    if(!codigo || !nuevaPass){ state.loginError='Rellena el código y la nueva contraseña.'; render(); return; }
    if(nuevaPass.length < 6){ state.loginError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
    btnRecoverConfirm.disabled = true; btnRecoverConfirm.textContent='Cambiando...';
    try{
      const sesion = await authVerificarCodigo(state.recoverEmail, codigo);
      await authCambiarPassword(sesion.access_token, nuevaPass);
      state.loginMode='signin'; state.recoverStep=null; state.recoverEmail=null; state.loginInfo=null; state.loginError=null;
      render();
      showToast('Contraseña actualizada. Ya puedes iniciar sesión con ella ✓');
    }catch(e){
      state.loginError = e.message || 'Código incorrecto o caducado.';
      render();
    }
  };
  document.querySelectorAll('[data-quick]').forEach(b=>{
    b.onclick = ()=>{ state.loggedIn=true; state.quickRole=b.dataset.quick; cargarNotifs(); render(); startSync(); };
  });
  // Cascada Comunidad → Provincia → Grupo en el registro (sin redibujar toda
  // la pantalla, para no perder el email/contraseña ya escritos).
  const authComunidadSel = document.getElementById('auth-comunidad');
  if(authComunidadSel){
    authComunidadSel.addEventListener('change', ()=>{
      const c = authComunidadSel.value;
      const t = TERRITORIOS[c];
      const provWrap = document.getElementById('auth-provincia-wrap');
      const provSel = document.getElementById('auth-provincia');
      if(t && t.tipo==='provincias'){
        provWrap.style.display='';
        provSel.innerHTML = provinciaOptionsHtml(c);
      } else {
        provWrap.style.display='none';
        provSel.innerHTML = '';
      }
      document.getElementById('auth-grupo').innerHTML = grupoOptionsHtml(c, provSel.value);
    });
  }
  const authProvinciaSel = document.getElementById('auth-provincia');
  if(authProvinciaSel){
    authProvinciaSel.addEventListener('change', ()=>{
      document.getElementById('auth-grupo').innerHTML = grupoOptionsHtml(authComunidadSel.value, authProvinciaSel.value);
    });
  }
  const btnAuthSubmit = document.getElementById('btn-auth-submit');
  if(btnAuthSubmit) btnAuthSubmit.onclick = async ()=>{
    const email = (document.getElementById('auth-email').value||'').trim();
    const password = document.getElementById('auth-password').value||'';
    if(!email || !password){ state.loginError='Rellena email y contraseña.'; render(); return; }
    btnAuthSubmit.disabled = true; btnAuthSubmit.textContent = 'Un momento...';
    try{
      let data;
      if(state.loginMode==='signup'){
        data = await authSignUp(email, password);
        if(!data.access_token){
          state.loginError = 'Cuenta creada. Si tu proyecto pide confirmar el email, revisa tu correo y luego inicia sesión.';
          state.loginMode = 'signin'; render(); return;
        }
        const defaults = {
          nombre: document.getElementById('auth-nombre').value || 'Sin nombre',
          rol: document.getElementById('auth-rol').value,
          comunidad: document.getElementById('auth-comunidad').value || null,
          provincia: document.getElementById('auth-provincia').value || null,
          grupo: document.getElementById('auth-grupo').value || null,
        };
        state.authUser = data.user; state.authToken = data.access_token;
        state.authProfile = await fetchOrCreatePerfil(data.user.id, data.access_token, defaults);
      } else {
        data = await authSignIn(email, password);
        state.authUser = data.user; state.authToken = data.access_token;
        state.authProfile = await fetchOrCreatePerfil(data.user.id, data.access_token, {nombre:email.split('@')[0], rol:'miembro'});
      }
      state.loggedIn = true; state.loginError = null;
      render(); startSync();
    }catch(e){
      const msg = e.message || '';
      state.loginError = msg.includes('Failed to fetch')
        ? 'No se pudo conectar con Supabase (revisa tu conexión a internet, o que la URL/clave sean correctas).'
        : msg || 'Algo ha ido mal, inténtalo de nuevo.';
      render();
    }
  };

  const logout = document.getElementById('btn-logout');
  if(logout) logout.onclick = ()=>{
    state.loggedIn=false; state.panel='home';
    state.authUser=null; state.authToken=null; state.authProfile=null;
    render();
  };
  // ===== Ascensor: abrir/cerrar el desplegable y navegar a un piso =====
   const btnAscensor = document.getElementById('btn-ascensor');
  if(btnAscensor){
    // Click en el icono + texto → ir al piso actual (o al grupo por defecto)
    const zonaIr = btnAscensor.querySelector('.asc-ir');
    if(zonaIr){
      zonaIr.onclick = (e)=>{
        e.stopPropagation();
        irAPisoActual();
      };
    }
    // Click en la flecha ▼ → abrir/cerrar el desplegable
    const zonaToggle = btnAscensor.querySelector('.asc-toggle');
    if(zonaToggle){
      zonaToggle.onclick = (e)=>{
        e.stopPropagation();
        const menu = document.getElementById('ascensor-menu');
        if(!menu) return;
        const abierto = menu.classList.toggle('abierto');
        if(abierto){
          const rect = btnAscensor.getBoundingClientRect();
          menu.style.top  = (rect.bottom + 6) + 'px';
          menu.style.left = Math.max(8, rect.left) + 'px';
        }
      };
    }
  }

  document.addEventListener('click', (e)=>{
    const menu = document.getElementById('ascensor-menu');
    if(!menu || !menu.classList.contains('abierto')) return;
    if(e.target.closest('#btn-ascensor') || e.target.closest('#ascensor-menu')) return;
    menu.classList.remove('abierto');
  });

  document.querySelectorAll('.ascensor-item').forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.dataset.pisoIdx, 10);
      const piso = window.__pisosAscensor && window.__pisosAscensor[idx];
      if(piso) irAPiso(piso);
      const menu = document.getElementById('ascensor-menu');
      if(menu) menu.classList.remove('abierto');
    };
  });
  // ===== Fin ascensor =====

  // ===== Menú ⋮ de cada nota (editar / eliminar) =====
  document.querySelectorAll('[data-nota-menu]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.notaMenu;
      const dropdown = document.getElementById(`nota-menu-dropdown-${id}`);
      document.querySelectorAll('.nota-menu-dropdown').forEach(d=>{
        if(d !== dropdown) d.classList.remove('abierto');
      });
      if(dropdown) dropdown.classList.toggle('abierto');
    };
  });

  document.querySelectorAll('[data-nota-edit]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = parseInt(el.dataset.notaEdit, 10);
      abrirModalEditarNota(id);
    };
  });

  document.querySelectorAll('[data-nota-del]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const id = parseInt(el.dataset.notaDel, 10);
      await eliminarNota(id);
    };
  });

  document.querySelectorAll('[data-leer-mas]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      abrirModalLeerNota(parseInt(el.dataset.leerMas, 10));
    };
  });

  document.addEventListener('click', (e)=>{
    if(e.target.closest('.nota-menu')) return;
    document.querySelectorAll('.nota-menu-dropdown').forEach(d=>d.classList.remove('abierto'));
  });

  // Cerrar modal de lectura
  const closeLeerNota = document.getElementById('close-leer-nota');
  if(closeLeerNota) closeLeerNota.onclick = ()=>{ state.modal = null; state.lecturaNotaId = null; render(); };
  const overlayLeerNota = document.getElementById('overlay-leer-nota');
  if(overlayLeerNota) overlayLeerNota.addEventListener('click', e=>{
    if(e.target.id === 'overlay-leer-nota'){ state.modal = null; state.lecturaNotaId = null; render(); }
  });

  // ===== CALENDARIO: navegación de mes =====
  document.querySelectorAll('[data-cal-mes]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const delta = parseInt(btn.dataset.calMes, 10);
      let mes = state.calMes;
      let anio = state.calAnio;
      mes += delta;
      if(mes < 0){ mes = 11; anio--; }
      if(mes > 11){ mes = 0; anio++; }
      state.calMes = mes;
      state.calAnio = anio;
      state.calDiaSel = null; // deselecciona el día al cambiar de mes
      render();
    };
  });

  // ===== CALENDARIO: seleccionar día =====
  document.querySelectorAll('[data-cal-dia]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const dia = parseInt(el.dataset.calDia, 10);
      state.calDiaSel = dia;
      render();
    };
  });

  // ===== CALENDARIO: pulsar un evento (abre modal de lectura) =====
  document.querySelectorAll('[data-cal-evento]').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-cal-inscribir]')) return; // si pulsó el botón, no abre modal
      e.stopPropagation();
      const id = parseInt(el.dataset.calEvento, 10);
      abrirModalLeerNota(id);
    };
  });

  // ===== CALENDARIO: botón "Apuntarse" desde el calendario =====
  document.querySelectorAll('[data-cal-inscribir]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = parseInt(btn.dataset.calInscribir, 10);
      state.reservaNotaId = id;
      state.modal = 'reserva';
      render();
    };
  });
  // ===== Carta de usuario: pulsar el icono para abrirla =====
  document.querySelectorAll('[data-abrir-carta]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const id = el.dataset.abrirCarta;
      abrirCartaUsuario(id);
    };
  });
  // ===== Carta de usuario: handlers =====
  const closeCartaUsuario = document.getElementById('close-carta-usuario');
  if(closeCartaUsuario) closeCartaUsuario.onclick = ()=>{ state.modal = null; state.cartaUsuarioId = null; render(); };
  const overlayCartaUsuario = document.getElementById('overlay-carta-usuario');
  if(overlayCartaUsuario) overlayCartaUsuario.addEventListener('click', e=>{
    if(e.target.id === 'overlay-carta-usuario'){ state.modal = null; state.cartaUsuarioId = null; render(); }
  });

  const btnPromocionar = document.getElementById('btn-promocionar');
  if(btnPromocionar) btnPromocionar.onclick = ()=>{
    state.modal = 'promocionar';
    render();
  };

  const closePromocionar = document.getElementById('close-promocionar');
  if(closePromocionar) closePromocionar.onclick = ()=>{ state.modal = 'cartaUsuario'; render(); };
  const closePromocionar2 = document.getElementById('close-promocionar-2');
  if(closePromocionar2) closePromocionar2.onclick = ()=>{ state.modal = 'cartaUsuario'; render(); };
  const overlayPromocionar = document.getElementById('overlay-promocionar');
  if(overlayPromocionar) overlayPromocionar.addEventListener('click', e=>{
    if(e.target.id === 'overlay-promocionar'){ state.modal = 'cartaUsuario'; render(); }
  });
  const savePromocionar = document.getElementById('save-promocionar');
  if(savePromocionar) savePromocionar.onclick = ()=> guardarPromocion();

  // ===== Mensajes directos: handlers =====
  const btnDm = document.getElementById('btn-dm');
  if(btnDm) btnDm.onclick = ()=>{
    state.modal = 'mensajesDirectos';
    state.dmAbiertoCon = null;
    render();
    fetchMensajesDirectos();
  };
  const closeDm = document.getElementById('close-dm');
  if(closeDm) closeDm.onclick = ()=>{ state.modal = null; state.dmAbiertoCon = null; render(); };
  const closeDm2 = document.getElementById('close-dm-2');
  if(closeDm2) closeDm2.onclick = ()=>{ state.modal = null; state.dmAbiertoCon = null; render(); };
  const overlayDm = document.getElementById('overlay-dm');
  if(overlayDm) overlayDm.addEventListener('click', e=>{
    if(e.target.id === 'overlay-dm'){ state.modal = null; state.dmAbiertoCon = null; render(); }
  });
  const dmBack = document.getElementById('dm-back');
  if(dmBack) dmBack.onclick = ()=>{ state.dmAbiertoCon = null; render(); };
  // Bloque 9: pinchar la fila de un miembro (con cuenta) abre el chat directo;
  // el avatar abre la carta y los botones no se ven afectados.
  document.querySelectorAll('[data-dm-perfil]').forEach(r=>{
    r.onclick = (e)=>{
      if(e.target.closest('[data-abrir-carta], button')) return;
      const perfilId = r.dataset.dmPerfil;
      if(String(perfilId) === String(miPerfilId())) return;
      state.modal = 'mensajesDirectos';
      state.dmAbiertoCon = perfilId;
      render();
      marcarDmLeidos(perfilId);
      fetchMensajesDirectos();
    };
  });
  document.querySelectorAll('[data-dm-con]').forEach(b=>{
    b.onclick = ()=>{ state.dmAbiertoCon = b.dataset.dmCon; marcarDmLeidos(b.dataset.dmCon); render(); };
  });
  const btnDmSend = document.getElementById('btn-dm-send');
  if(btnDmSend){
    const doSendDm = async ()=>{
      const inp = document.getElementById('dm-input-box');
      const paraId = state.dmAbiertoCon;
      const me = miPerfilId();
      if(inp && inp.value.trim() && paraId && me){
        const texto = inp.value.trim();
        inp.value = '';
        const nuevo = { id: Date.now(), de_id: me, para_id: paraId, texto, leido: false, creado: new Date().toISOString() };
        state.mensajesDirectos.push(nuevo);
        pintarDm();
        const saved = await insertMensajeDirecto({ de_id: me, para_id: paraId, texto });
        if(saved && saved.id){ nuevo.id = saved.id; }
        setTimeout(()=>fetchMensajesDirectos(true), 600);
      }
    };
    btnDmSend.onclick = doSendDm;
    const inpEl = document.getElementById('dm-input-box');
    if(inpEl) inpEl.addEventListener('keydown', e=>{ if(e.key==='Enter') doSendDm(); });
  }
  const btnDmCarta = document.getElementById('btn-dm-carta');
  if(btnDmCarta) btnDmCarta.onclick = ()=>{
    const id = state.cartaUsuarioId;
    const membresia = state.membresias.find(m => String(m.id) === String(id));
    const perfil = state.perfiles.find(p => String(p.id) === String(id))
      || (membresia && membresia.perfil_id ? state.perfiles.find(p => String(p.id) === String(membresia.perfil_id)) : null);
    if(perfil){
      state.modal = 'mensajesDirectos';
      state.dmAbiertoCon = perfil.id;
      render();
      marcarDmLeidos(perfil.id);
      fetchMensajesDirectos();
    }
  };

  const btnQuitarMembresiaCarta = document.getElementById('btn-quitar-membresia-carta');
  if(btnQuitarMembresiaCarta) btnQuitarMembresiaCarta.onclick = async ()=>{
    if(!confirm('¿Quitar a esta persona de la lista?')) return;
    const id = state.cartaUsuarioId;
    await deleteMembresia(id);
    state.membresias = state.membresias.filter(m => String(m.id) !== String(id));
    state.modal = null; state.cartaUsuarioId = null; render();
    showToast('Quitado de la lista');
  };


  const btnSubirTodo = document.getElementById('btn-subir-todo');

    const sendNota = document.getElementById('send-nota');
  if(sendNota) sendNota.onclick = async ()=>{
    if(state.noteType==='actividad'){ state.modal='evento'; render(); return; }
    const titleInp = document.querySelector('.modal-body .mfield input[placeholder*="Recogida"]');
    const msgInp = document.querySelector('.modal-body textarea');
    const lugarInp = document.getElementById('nota-lugar');

    const alcanceSel = document.getElementById('sel-alcance');
           const canalSel = document.querySelector('input[name="canal-nota"]:checked');
          const canalDirectiva = canalSel ? canalSel.value === 'directiva' : false;
    const scopeLevel = alcanceSel ? parseInt(alcanceSel.value,10) : 0;
    // Etiqueta bonita del alcance (v3.9): "Comunidad · Andalucía", etc.
    const scopeLabel = (()=>{
      const hc0 = homeCtx();
      if(scopeLevel === 0) return `Guilda · ${state.seccion || ''}`.trim();
      if(scopeLevel === 1) return `Grupo · ${hc0.grupo || ''}`.trim();
      if(scopeLevel === 2) return `Provincia · ${hc0.provincia || ''}`.trim();
      if(scopeLevel === 3) return `Comunidad · ${hc0.comunidad || ''}`.trim();
      if(scopeLevel === 4) return 'Hermes (Red Nacional)';
      if(scopeLevel === 5) return 'Toda España (Global)';
      return NIVEL_LABELS[scopeLevel] || 'General';
    })();
    const role = currentRole();
    const hc = homeCtx();

    // v3.9: el estado (publicada o pendiente de aprobación) lo decide el motor
    // de aprobación, no una simple comparación de niveles.
    const prop = calcularEstadoPropuesta(role, scopeLevel);
    const needsApproval = prop.estado === 'pendiente';

    const esEdicion = !!state.editingNotaId;
    const notaExistente = esEdicion ? state.notas.find(n => String(n.id) === String(state.editingNotaId)) : null;

    const tipoFinal = state.noteType==='evento' ? 'evento' : (state.noteType==='actividad' ? 'actividad' : 'aviso');
    const tituloFinal = (titleInp && titleInp.value) || 'Nueva nota';
    const msgFinal = (msgInp && msgInp.value) || '';
    const lugarFinal = lugarInp ? (lugarInp.value || null) : null;
    const fechaFinal = fechaInp ? (fechaInp.value || null) : null;
    const horaFinal = horaInp ? (horaInp.value || null) : null;

    // ===== MODO EDICIÓN =====
    if(esEdicion && notaExistente){
      const cambios = [];
      if(notaExistente.titulo !== tituloFinal) cambios.push('titulo');
      if(notaExistente.msg !== msgFinal) cambios.push('msg');
      if((notaExistente.lugar||null) !== lugarFinal) cambios.push('lugar');
      if((notaExistente.fecha||null) !== fechaFinal) cambios.push('fecha');
      if((notaExistente.hora||null) !== horaFinal) cambios.push('hora');
      if(notaExistente.tipo !== tipoFinal) cambios.push('tipo');
      if(Number(notaExistente.nivelAlcance) !== scopeLevel) cambios.push('alcance');
      if(notaExistente.canalDirectiva !== canalDirectiva) cambios.push('canal');

      const historial = Array.isArray(notaExistente.historial_ediciones) ? notaExistente.historial_ediciones.slice() : [];
      historial.push({ fecha: new Date().toISOString(), cambios });
      if(historial.length > 5) historial.shift();

      // Si el autor corrige una propuesta rechazada, vuelve a entrar en el
      // circuito de aprobación (o se publica si ya no excede su rango).
      const eraRechazada = notaExistente.estado === 'rechazada';
      const datosEdicion = Object.assign({
        tipo: tipoFinal,
        titulo: tituloFinal,
        msg: msgFinal,
        audiencia: scopeLabel,
        nivelAlcance: scopeLevel,
        canalDirectiva: canalDirectiva,
        origenGrupo: notaExistente.origenGrupo || hc.grupo,
        origenProvincia: notaExistente.origenProvincia || hc.provincia,
        origenComunidad: notaExistente.origenComunidad || hc.comunidad,
        lugar: lugarFinal,
        fecha: fechaFinal,
        hora: horaFinal,
        editada: true,
        historial_ediciones: historial,
      }, prop, {
        // Al reenviar se limpia el rastro del rechazo anterior.
        motivoRechazo: eraRechazada ? null : notaExistente.motivoRechazo,
        reenviadaEl: eraRechazada ? new Date().toISOString() : notaExistente.reenviadaEl,
        aprobadaPor: prop.estado === 'aprobada' ? null : notaExistente.aprobadaPor,
      });

      // Actualizar local
      Object.assign(notaExistente, datosEdicion);

      // Actualizar en Supabase
      try{
        const res = await fetch(`${SUPABASE_NOTAS_REST}?id=eq.${state.editingNotaId}`, {
          method: 'PATCH',
          headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=minimal'}),
          body: JSON.stringify(notaAPayload(datosEdicion)),
        });
        if(!res.ok){
          const body = await res.text();
          warnCloudFail(`Actualizar nota (${res.status}): ${body.slice(0,120)}`);
        }
      }catch(e){ warnCloudFail('Actualizar nota'); }

      state.modal = null;
      state.editingNotaId = null;
      state.adjuntosPendientes = [];
      render();
      showToast(needsApproval
        ? `Guardada y reenviada a ${ROLE_APPROVER[role] || 'tu responsable'}`
        : 'Nota actualizada y publicada ✓');
      return;
    }

    // ===== MODO CREACIÓN =====
    const nuevaNota = {
      id: Date.now(),
      tipo: tipoFinal,
      titulo: tituloFinal,
      msg: msgFinal,
      audiencia: scopeLabel,
      nivelAlcance: scopeLevel,
      origenGrupo: hc.grupo,
      origenProvincia: hc.provincia,
      origenComunidad: hc.comunidad,
      origenGuilda: (state.seccionTipo === 'guilda' && state.seccion) ? state.seccion : null,
      canalDirectiva: canalDirectiva,
      // Autoría: imprescindible para saber quién propone y a quién avisar.
      autorId: personaId(),
      autorNombre: displayName(),
      autorRol: role,
      tiempo: 'justo ahora',
      lugar: lugarFinal,
      fecha: fechaFinal,
      hora: horaFinal,
      editada: false,
      historial_ediciones: [],
      // v3.9: estado dentro de la cadena de aprobación.
      estado: prop.estado,
      pendiente: prop.pendiente,
      excedeRango: prop.excedeRango,
      aprobadorRol: prop.aprobadorRol,
      motivoRechazo: null,
      aprobadaPor: prop.estado === 'aprobada' ? displayName() : null,
      creadaEl: new Date().toISOString(),
    };

    const adjuntosAPublicar = state.adjuntosPendientes.slice();
    state.notas.unshift(nuevaNota);
    adjuntosAPublicar.forEach(a=> state.adjuntos.push({id:a.id, nota_id:nuevaNota.id, nombre:a.nombre, tipo:a.tipo}));
    state.adjuntosPendientes = [];
    state.modal = null;
    state.editingNotaId = null;
    render();
    if(needsApproval){
      showToast(`⏳ Propuesta enviada a ${ROLE_APPROVER[role] || 'tu responsable'} para aprobación`);
    } else {
      showToast('¡Nota pinchada en el corcho!');
    }
    insertNota(nuevaNota);
    adjuntosAPublicar.forEach(a=> insertAdjunto({id:a.id, nota_id:nuevaNota.id, nombre:a.nombre, tipo:a.tipo, datos:a.datos}));
  }

  // MODAL: reserva
  const closeReserva = document.getElementById('close-reserva'); if(closeReserva) closeReserva.onclick=()=>{state.modal=null;state.reservaNotaId=null;render();};
  const confirmReserva = document.getElementById('confirm-reserva');
  if(confirmReserva) confirmReserva.onclick = ()=>{
    if(state.reservaNotaId==null){ state.modal=null; render(); return; }
    const selAcomp = document.getElementById('sel-acompanantes');
    const txtComentario = document.getElementById('txt-comentario-reserva');
    const miLabel = displayName();
    const nuevaInscripcion = {
      id: Date.now(),
      nota_id: state.reservaNotaId,
      persona: personaId(),
      personaLabel: miLabel,
      acompanantes: selAcomp ? parseInt(selAcomp.value,10) : 0,
      comentario: (txtComentario && txtComentario.value) || '',
    };
    state.inscripciones.push(nuevaInscripcion); // reflejo inmediato en este dispositivo
    state.modal=null; state.reservaNotaId=null; render();
    showToast('Asistencia confirmada ✓');
    insertInscripcion(nuevaInscripcion); // fila propia en Supabase: no pisa inscripciones de otros
  };

  // MODAL: evento sliders
  document.querySelectorAll('[data-slider]').forEach(s=>{
    s.addEventListener('input', ()=>{
      const v=parseInt(s.value,10);
      const lbl=document.getElementById('val-'+s.dataset.slider);
      if(lbl) lbl.textContent=(v>=0?'+':'')+v;
    });
  });
  const closeEvento = document.getElementById('close-evento'); if(closeEvento) closeEvento.onclick=()=>{state.modal=null;render();};
  const sendEvento = document.getElementById('send-evento');
  if(sendEvento) sendEvento.onclick = ()=>{
    const nombre = document.getElementById('evento-nombre').value || 'Nueva Actividad';
    const vals={};
    document.querySelectorAll('[data-slider]').forEach(s=> vals[s.dataset.slider]=parseInt(s.value,10));
    state.lastEventoNombre=nombre; state.lastEventoVals=vals;
    const nuevaActividad = {id:Date.now(), tipo:'actividad', titulo:nombre, msg:'Nueva misión disponible para tu sección.', audiencia:'Global', nivelAlcance:4, tiempo:'justo ahora', cta:'inscribirse', badge:'FIS +'+(vals.FIS||0)};
    state.notas.unshift(nuevaActividad); // reflejo inmediato en este dispositivo
    insertNota(nuevaActividad); // fila propia en Supabase: no pisa notas de otros dispositivos
    state.modal='qrDone'; render();
  };
  const closeQrDone = document.getElementById('close-qrdone'); if(closeQrDone) closeQrDone.onclick=()=>{state.modal=null;render();};
  const closeQrDone2 = document.getElementById('close-qrdone-2'); if(closeQrDone2) closeQrDone2.onclick=()=>{state.modal=null;render(); showToast('¡Actividad publicada en el corcho!');};

  // MODAL: section
  document.querySelectorAll('[data-swatch]').forEach(s=>{
    s.onclick=()=>{ document.querySelectorAll('[data-swatch]').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); };
  });
  const closeSection = document.getElementById('close-section'); if(closeSection) closeSection.onclick=()=>{state.modal=null;state.editingGuilda=null;render();};
  const cancelSection = document.getElementById('cancel-section'); if(cancelSection) cancelSection.onclick=()=>{state.modal=null;state.editingGuilda=null;render();};
  let seccionIconoDataUrl = state.editingGuilda ? (getGuildaMeta(state.editingGuilda.grupo, state.editingGuilda.nombre)||{}).icono || null : null;
  const seccionIconoFile = document.getElementById('section-icono-file');
  const seccionDropzone = document.getElementById('section-dropzone');
  if(seccionDropzone) seccionDropzone.onclick = ()=> seccionIconoFile && seccionIconoFile.click();
  if(seccionIconoFile) seccionIconoFile.addEventListener('change', ()=>{
    const file = seccionIconoFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      seccionIconoDataUrl = reader.result;
      if(seccionDropzone){ seccionDropzone.style.padding='6px'; seccionDropzone.innerHTML = `<img src="${seccionIconoDataUrl}" style="width:52px;height:52px;object-fit:cover;border-radius:10px;">`; }
    };
    reader.readAsDataURL(file);
  });
  const saveSection = document.getElementById('save-section');
  if(saveSection) saveSection.onclick=()=>{
    if(!state.grupo) return;
    const g = state.grupo.nombre;
    const nombreNuevo = (document.getElementById('section-nombre').value||'Nueva Guilda').trim();
    const swSel = document.querySelector('[data-swatch].sel');
    const meta = {
      detalles: document.getElementById('section-detalles').value||'',
      tipo: document.getElementById('section-tipo').value,
      icono: seccionIconoDataUrl,
      color: swSel ? swSel.dataset.swatch : SWATCHES[0],
    };
    if(state.editingGuilda){
      const nombreViejo = state.editingGuilda.nombre;
      let nombreFinal = nombreViejo;
      if(nombreNuevo && nombreNuevo!==nombreViejo){
        if(renameGuilda(g, nombreViejo, nombreNuevo)) nombreFinal = nombreNuevo;
        else showToast('Ya existe una guilda con ese nombre');
      }
      saveGuildaMeta(g, nombreFinal, meta);
      showToast('Guilda actualizada ✓');
    } else {
      if(addGuilda(g, nombreNuevo)) saveGuildaMeta(g, nombreNuevo, meta);
      showToast('Guilda creada ✓');
    }
    state.modal=null; state.editingGuilda=null; render(); pushSharedState();
  };

  // MODAL: scout
  const closeScout = document.getElementById('close-scout'); if(closeScout) closeScout.onclick=()=>{state.modal=null;render();};
  const cancelScout = document.getElementById('cancel-scout'); if(cancelScout) cancelScout.onclick=()=>{state.modal=null;render();};
  const scoutPerfilSel = document.getElementById('scout-perfil');
  const scoutNombreManualField = document.getElementById('scout-nombre-manual-field');
  if(scoutPerfilSel) scoutPerfilSel.onchange = ()=>{
    if(scoutNombreManualField) scoutNombreManualField.style.display = scoutPerfilSel.value==='__manual__' ? 'block' : 'none';
  };
  const saveScout = document.getElementById('save-scout');
  if(saveScout) saveScout.onclick = ()=>{
    if(!state.grupo) return;
    const g = state.grupo.nombre;
    const candidatos = state.perfiles.slice().sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
    const c = document.getElementById('scout-cargo').value || 'Miembro';
    const selVal = scoutPerfilSel ? scoutPerfilSel.value : '__manual__';
    const nuevaMembresia = {
      id: Date.now(), tipo: state.seccionTipo, grupo: g,
      seccion: state.seccionTipo==='guilda' ? state.seccion : null,
      perfil_id: null, nombre_manual: null, cargo: c,
    };
    if(selVal && selVal!=='__manual__' && candidatos[parseInt(selVal,10)]){
      nuevaMembresia.perfil_id = candidatos[parseInt(selVal,10)].id;
    } else {
      nuevaMembresia.nombre_manual = document.getElementById('scout-nombre').value || 'Nuevo Scout'; // "cuenta fantasma": sin perfil real
    }
    state.membresias.push(nuevaMembresia); // reflejo inmediato en este dispositivo
    state.modal=null; render(); showToast('Añadido/a ✓');
    insertMembresia(nuevaMembresia); // fila propia en Supabase: sin límite de a cuántas guildas/grupos pertenece alguien
  };
  document.querySelectorAll('[data-quitar-membresia]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.quitarMembresia;
      state.membresias = state.membresias.filter(m=> String(m.id)!==String(id));
      render();
      deleteMembresia(id);
    };
  });

  // MODAL: personalizar comunidad (territorio)
  const closeTerrMeta = document.getElementById('close-terrmeta'); if(closeTerrMeta) closeTerrMeta.onclick=()=>{state.modal=null;state.editingTerritorio=null;render();};
  const cancelTerrMeta = document.getElementById('cancel-terrmeta'); if(cancelTerrMeta) cancelTerrMeta.onclick=()=>{state.modal=null;state.editingTerritorio=null;render();};
  let terrLogoDataUrl = (getTerritorioMeta(state.editingTerritorio)||{}).logo || null;
  const terrLogoFile = document.getElementById('terr-logo-file');
  const terrColorPrimario = document.getElementById('terr-color-primario');
  const terrColorSecundario = document.getElementById('terr-color-secundario');
  function refreshTerrPreview(){
    const box = document.getElementById('terr-preview-logo');
    const nombreEl = document.getElementById('terr-preview-nombre');
    const cp = terrColorPrimario ? terrColorPrimario.value : '#7C3AED';
    const cs = terrColorSecundario ? terrColorSecundario.value : '#EDE4FC';
    if(box){
      box.style.background = cp;
      box.innerHTML = terrLogoDataUrl ? `<img src="${terrLogoDataUrl}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="color:#fff;font-size:20px;">📍</span>';
      box.parentElement.style.background = cs;
      box.parentElement.style.borderColor = cp;
    }
    if(nombreEl) nombreEl.style.color = cp;
  }
  if(terrLogoFile) terrLogoFile.addEventListener('change', ()=>{
    const file = terrLogoFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ terrLogoDataUrl = reader.result; refreshTerrPreview(); };
    reader.readAsDataURL(file);
  });
  if(terrColorPrimario) terrColorPrimario.addEventListener('input', refreshTerrPreview);
  if(terrColorSecundario) terrColorSecundario.addEventListener('input', refreshTerrPreview);
  const saveTerrMeta = document.getElementById('save-terrmeta');
  if(saveTerrMeta) saveTerrMeta.onclick = ()=>{
    if(!state.editingTerritorio) return;
    const nombreActual = state.editingTerritorio;
    const nuevoNombre = (document.getElementById('terr-nombre-edit').value||'').trim();
    let nombreFinal = nombreActual;
    if(nuevoNombre && nuevoNombre!==nombreActual){
      if(renameTerritorio(nombreActual, nuevoNombre)) nombreFinal = nuevoNombre;
      else showToast('Ya existe una comunidad con ese nombre');
    }
    saveTerritorioMeta(nombreFinal, {
      logo: terrLogoDataUrl,
      colorPrimario: terrColorPrimario ? terrColorPrimario.value : '#7C3AED',
      colorSecundario: terrColorSecundario ? terrColorSecundario.value : '#EDE4FC',
      instagram: document.getElementById('terr-instagram').value,
      twitter: document.getElementById('terr-twitter').value,
      tiktok: document.getElementById('terr-tiktok').value,
      web: document.getElementById('terr-web').value,
    });
    state.modal=null; state.editingTerritorio=null; render();
    showToast('Comunidad personalizada ✓');
  };
  const deleteTerrMeta = document.getElementById('delete-terrmeta');
  if(deleteTerrMeta) deleteTerrMeta.onclick = ()=>{
    if(!state.editingTerritorio) return;
    const nombre = state.editingTerritorio;
    if(confirm(`¿Eliminar la comunidad "${nombre}" y todos sus grupos? Esta acción no se puede deshacer.`)){
      deleteTerritorio(nombre);
      state.modal=null; state.editingTerritorio=null; state.panel='comunidad'; render();
      showToast('Comunidad eliminada');
    }
  };

  // MODAL: personalizar provincia
  const closeProvMeta = document.getElementById('close-provmeta'); if(closeProvMeta) closeProvMeta.onclick=()=>{state.modal=null;state.editingProvincia=null;render();};
  const cancelProvMeta = document.getElementById('cancel-provmeta'); if(cancelProvMeta) cancelProvMeta.onclick=()=>{state.modal=null;state.editingProvincia=null;render();};
  let provLogoDataUrl = (getProvinciaMeta(state.editingProvincia?.comunidad, state.editingProvincia?.provincia)||{}).logo || null;
  const provLogoFile = document.getElementById('prov-logo-file');
  const provColorPrimario = document.getElementById('prov-color-primario');
  const provColorSecundario = document.getElementById('prov-color-secundario');
  function refreshProvPreview(){
    const box = document.getElementById('prov-preview-logo');
    const nombreEl = document.getElementById('prov-preview-nombre');
    const cp = provColorPrimario ? provColorPrimario.value : '#7C3AED';
    const cs = provColorSecundario ? provColorSecundario.value : '#EDE4FC';
    if(box){
      box.style.background = cp;
      box.innerHTML = provLogoDataUrl ? `<img src="${provLogoDataUrl}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="color:#fff;font-size:20px;">📍</span>';
      box.parentElement.style.background = cs;
      box.parentElement.style.borderColor = cp;
    }
    if(nombreEl) nombreEl.style.color = cp;
  }
  if(provLogoFile) provLogoFile.addEventListener('change', ()=>{
    const file = provLogoFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ provLogoDataUrl = reader.result; refreshProvPreview(); };
    reader.readAsDataURL(file);
  });
  if(provColorPrimario) provColorPrimario.addEventListener('input', refreshProvPreview);
  if(provColorSecundario) provColorSecundario.addEventListener('input', refreshProvPreview);
  const saveProvMeta = document.getElementById('save-provmeta');
  if(saveProvMeta) saveProvMeta.onclick = ()=>{
    if(!state.editingProvincia) return;
    let {comunidad, provincia} = state.editingProvincia;
    const nuevoNombre = (document.getElementById('prov-nombre-edit').value||'').trim();
    if(nuevoNombre && nuevoNombre!==provincia){
      if(renameProvincia(comunidad, provincia, nuevoNombre)) provincia = nuevoNombre;
      else showToast('Ya existe una provincia con ese nombre');
    }
    saveProvinciaMeta(comunidad, provincia, {
      logo: provLogoDataUrl,
      colorPrimario: provColorPrimario ? provColorPrimario.value : '#7C3AED',
      colorSecundario: provColorSecundario ? provColorSecundario.value : '#EDE4FC',
      instagram: document.getElementById('prov-instagram').value,
      twitter: document.getElementById('prov-twitter').value,
      tiktok: document.getElementById('prov-tiktok').value,
      web: document.getElementById('prov-web').value,
    });
    state.modal=null; state.editingProvincia=null; render();
    showToast('Provincia personalizada ✓');
  };
  const deleteProvMeta = document.getElementById('delete-provmeta');
  if(deleteProvMeta) deleteProvMeta.onclick = ()=>{
    if(!state.editingProvincia) return;
    const {comunidad, provincia} = state.editingProvincia;
    if(confirm(`¿Eliminar la provincia "${provincia}" y todos sus grupos? Esta acción no se puede deshacer.`)){
      deleteProvincia(comunidad, provincia);
      state.modal=null; state.editingProvincia=null; state.panel='provincia'; render();
      showToast('Provincia eliminada');
    }
  };

  // MODAL: editar grupo (nombre + redes + foto + eliminar)
  const closeGrupoMeta = document.getElementById('close-grupometa'); if(closeGrupoMeta) closeGrupoMeta.onclick=()=>{state.modal=null;state.editingGrupo=null;render();};
  const cancelGrupoMeta = document.getElementById('cancel-grupometa'); if(cancelGrupoMeta) cancelGrupoMeta.onclick=()=>{state.modal=null;state.editingGrupo=null;render();};
  let grupoLogoDataUrl = (getGrupoMeta(state.editingGrupo?.nombre)||{}).logo || null;
  const grupoLogoFile = document.getElementById('grupo-logo-file');
  if(grupoLogoFile) grupoLogoFile.addEventListener('change', ()=>{
    const file = grupoLogoFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      grupoLogoDataUrl = reader.result;
      const box = document.getElementById('grupo-preview-logo');
      if(box) box.innerHTML = `<img src="${grupoLogoDataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);
  });
  const deleteGrupoMeta = document.getElementById('delete-grupometa');
  if(deleteGrupoMeta) deleteGrupoMeta.onclick = ()=>{
    if(!state.editingGrupo) return;
    const {comunidad, provincia, nombre} = state.editingGrupo;
    if(confirm(`¿Eliminar el grupo "${nombre}"? Esta acción no se puede deshacer.`)){
      deleteGrupo(comunidad, provincia, nombre);
      state.modal=null; state.editingGrupo=null; state.panel='grupo-list'; render();
      showToast('Grupo eliminado');
    }
  };
  const saveGrupoMetaBtn = document.getElementById('save-grupometa');
  if(saveGrupoMetaBtn) saveGrupoMetaBtn.onclick = ()=>{
    if(!state.editingGrupo) return;
    const {comunidad, provincia, nombre} = state.editingGrupo;
    const nuevoNombre = (document.getElementById('grupo-nombre-edit').value||'').trim();
    let nombreFinal = nombre;
    if(nuevoNombre && nuevoNombre!==nombre){
      if(renameGrupo(comunidad, provincia, nombre, nuevoNombre)) nombreFinal = nuevoNombre;
      else showToast('Ya existe un grupo con ese nombre');
    }
    saveGrupoMeta(nombreFinal, {
      logo: grupoLogoDataUrl,
      instagram: document.getElementById('grupo-instagram').value,
      twitter: document.getElementById('grupo-twitter').value,
      tiktok: document.getElementById('grupo-tiktok').value,
      web: document.getElementById('grupo-web').value,
    });
    state.modal=null; state.editingGrupo=null; render();
    showToast('Grupo actualizado ✓'); pushSharedState();
  };

  // MODAL: añadir Local (sede o comercio afiliado)
  const closeLocal = document.getElementById('close-local'); if(closeLocal) closeLocal.onclick=()=>{state.modal=null;render();};
  const cancelLocal = document.getElementById('cancel-local'); if(cancelLocal) cancelLocal.onclick=()=>{state.modal=null;render();};
  let localCoordEncontrado = null;
  let localFotoDataUrl = null;
  const localFotoFile = document.getElementById('local-foto-file');
  if(localFotoFile) localFotoFile.addEventListener('change', ()=>{
    const file = localFotoFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ localFotoDataUrl = reader.result; };
    reader.readAsDataURL(file);
  });
  const btnBuscarDireccion = document.getElementById('btn-buscar-direccion');
  if(btnBuscarDireccion) btnBuscarDireccion.onclick = async ()=>{
    const q = (document.getElementById('local-direccion').value||'').trim();
    const resultDiv = document.getElementById('local-resultado-busqueda');
    const saveBtn = document.getElementById('save-local');
    if(!q){ resultDiv.textContent='Escribe primero una dirección.'; return; }
    resultDiv.textContent = '🔎 Buscando...';
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q=${encodeURIComponent(q)}`);
      const rows = await res.json();
      if(!rows || rows.length===0){
        resultDiv.innerHTML = '⚠ No se encontró esa dirección. Prueba a ser más concreto (calle, ciudad).';
        localCoordEncontrado = null;
        saveBtn.disabled = true; saveBtn.style.opacity='.5';
        return;
      }
      localCoordEncontrado = {lat: parseFloat(rows[0].lat), lng: parseFloat(rows[0].lon)};
      resultDiv.innerHTML = `✓ Encontrado: ${rows[0].display_name}`;
      saveBtn.disabled = false; saveBtn.style.opacity='1';
    }catch(e){
      resultDiv.textContent = '⚠ No se pudo buscar (revisa tu conexión a internet).';
    }
  };
  const saveLocal = document.getElementById('save-local');
  if(saveLocal) saveLocal.onclick = ()=>{
    if(!localCoordEncontrado){ showToast('Busca antes una dirección válida'); return; }
    const grupoNombre = document.getElementById('local-grupo').value;
    const grupoId = idMap.grupos[grupoNombre];
    const nombre = (document.getElementById('local-nombre').value||'Local sin nombre').trim();
    const tipo = document.getElementById('local-tipo').value;
    const direccion = document.getElementById('local-direccion').value;
    addLocal({
      grupo_id: grupoId!=null?grupoId:null, nombre, tipo, direccion,
      lat: localCoordEncontrado.lat, lng: localCoordEncontrado.lng, foto_url: localFotoDataUrl,
    });
    state.modal=null; render();
    showToast('📍 Local añadido — acércate en el mapa para verlo');
  };
}

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2400);
}

cargarNotifs();
render();
if(state.loggedIn){
  startSync();
}
</script>
</body>
</html>
