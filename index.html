<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScoutPath OS · v3.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-900:#3B0F70;
    --purple-800:#4C1D95;
    --purple-700:#5B21B6;
    --purple-600:#6D28D9;
    --purple-500:#7C3AED;
    --purple-300:#C4B5FD;
    --purple-100:#EDE4FC;
    --orange-600:#C2660A;
    --orange-500:#D97706;
    --orange-100:#FEF0DA;
    --cork:#CDA46A;
    --cork-dark:#B8894F;
    --wood:#5B3A22;
    --wood-dark:#402716;
    --paper-cream:#FBF3D9;
    --ink:#2E2110;
    --gray-900:#1F2430;
    --gray-700:#4B5262;
    --gray-500:#8A93A6;
    --gray-300:#DADFE8;
    --gray-100:#F3F5F9;
    --white:#FFFFFF;
    --green:#15803D;
    --red:#B91C1C;
    --sticky-yellow:#FCF0AE;
    --sticky-purple:#E6D8FB;
    --sticky-green:#D3F3DE;
    --sticky-blue:#DBEAFE;
    --font-display:'Baloo 2', 'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--gray-100);
    color:var(--gray-900);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c9c9d4;border-radius:8px;}

  /* ===== LOGIN ===== */
  .login-screen{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(180deg, rgba(15,10,30,.55), rgba(10,8,22,.85)),
      radial-gradient(ellipse at 30% 20%, #2a2450 0%, transparent 55%),
      linear-gradient(180deg,#0f0c22 0%, #1a1436 45%, #241a3f 100%);
    padding:32px 16px;
  }
  .login-card{
    width:100%;max-width:400px;background:var(--white);
    border-radius:22px;padding:34px 30px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,.45);
    text-align:center;
  }
  .login-logo{
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--purple-500), var(--purple-800));
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    box-shadow:0 0 0 6px rgba(124,58,237,.15);
  }
  .login-title{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.5px;color:var(--gray-900);margin:0;}
  .login-sub{color:var(--purple-600);font-weight:600;font-size:13px;margin:6px 0 24px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--gray-900);}
  .field input{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--gray-300);
    font-size:14px;outline:none;transition:.15s;background:#fff;
  }
  .field input:focus{border-color:var(--purple-500);box-shadow:0 0 0 3px var(--purple-100);}
  .field .hint{font-size:11px;color:var(--gray-500);margin-top:5px;}
  .btn-primary{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(180deg, var(--purple-600), var(--purple-700));
    color:#fff;font-weight:700;font-size:15px;margin-top:6px;
    box-shadow:0 6px 14px rgba(91,33,182,.35);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .login-help{font-size:12.5px;color:var(--gray-500);margin:18px 0 14px;}
  .login-help b{color:var(--purple-600);cursor:pointer;}
  .quick-box{border:1.5px dashed var(--gray-300);border-radius:12px;padding:14px 12px;}
  .quick-label{font-size:10.5px;letter-spacing:.06em;font-weight:700;color:var(--gray-500);margin-bottom:10px;}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .quick-grid button{
    border:none;border-radius:8px;padding:9px 4px;color:#fff;font-weight:700;font-size:12.5px;
  }
  .qk-scouter{background:#3F9C5C;}
  .qk-coord{background:#0F766E;}
  .qk-presi{background:#15803D;}
  .qk-ejec{background:#7C3AED;}
  .qk-nac{background:#B45309;}
  .qk-hermes{background:#B91C1C;grid-column:1/3;}
  .login-footer{margin-top:20px;font-size:11px;color:var(--gray-500);}

  /* ===== APP SHELL ===== */
  .topbar{
    background:#fff;border-bottom:1px solid var(--gray-300);
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 22px;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--purple-800);}
  .brand-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,var(--purple-500),var(--purple-800));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
  .topbar-mid{display:flex;align-items:center;gap:14px;flex:1;justify-content:center;flex-wrap:wrap;}
  .alert-chip{
    background:var(--orange-100);color:var(--orange-600);border:1px solid #F3D6A6;
    border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;
  }
  .session-select{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gray-700);}
  .session-select select{border:1px solid var(--gray-300);border-radius:8px;padding:7px 10px;font-size:12.5px;background:#fff;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
/* ===== Ascensor de secciones (chip + desplegable) ===== */
.ascensor-chip{
  background:var(--purple-100);color:var(--purple-800);border:1px solid var(--purple-300);
  border-radius:20px;font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:stretch;overflow:hidden;user-select:none;
  transition:.12s;
}
.ascensor-chip.vacio{background:var(--gray-100);color:var(--gray-500);border-color:var(--gray-300);opacity:.75;}
.ascensor-chip .asc-ir{
  padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;
}
.ascensor-chip .asc-ir:hover{background:#dfd4f5;}
.ascensor-chip.vacio .asc-ir{cursor:default;}
.ascensor-chip.vacio .asc-ir:hover{background:transparent;}
.ascensor-chip .asc-toggle{
  padding:7px 10px;cursor:pointer;display:flex;align-items:center;
  border-left:1px solid rgba(91,33,182,.25);font-size:10px;
}
.ascensor-chip .asc-toggle:hover{background:#dfd4f5;}
.ascensor-chip:hover{background:#dfd4f5;}
.ascensor-chip.vacio{background:var(--gray-100);color:var(--gray-500);border-color:var(--gray-300);cursor:default;opacity:.75;}
.ascensor-chip .flecha{font-size:9px;opacity:.65;}
.ascensor-menu{
  position:fixed;z-index:80;background:#fff;border:1px solid var(--gray-300);
  border-radius:12px;box-shadow:0 12px 30px rgba(20,10,40,.18);
  min-width:260px;max-width:340px;max-height:60vh;overflow-y:auto;padding:6px;
  display:none;
}
.ascensor-menu.abierto{display:block;}
.ascensor-menu .asc-head{
  font-size:9.5px;letter-spacing:.06em;font-weight:800;color:var(--gray-500);
  padding:8px 12px 4px;text-transform:uppercase;
}
.ascensor-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  cursor:pointer;transition:.1s;
}
.ascensor-item:hover{background:var(--purple-100);}
.ascensor-item .ic{font-size:17px;line-height:1;width:22px;text-align:center;}
.ascensor-item .nom{font-size:13px;font-weight:700;color:var(--gray-900);line-height:1.2;}
.ascensor-item .sub{font-size:10.5px;color:var(--gray-500);margin-top:1px;}
.ascensor-item.actual{background:var(--purple-100);}
.ascensor-vacio{
  padding:14px 12px;font-size:11.5px;color:var(--gray-500);text-align:center;
}
  .avatar-pill{width:34px;height:34px;border-radius:50%;background:var(--purple-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .logout-btn{border:none;background:none;color:var(--gray-500);font-size:18px;}
  .dm-btn{position:relative;border:none;background:var(--gray-100);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-700);}
  .dm-badge{position:absolute;top:-3px;right:-3px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box;}
  .dm-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow-y:auto;}
  .dm-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--gray-200);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;}
  .dm-item:hover{background:var(--gray-100);}
  .dm-avatar{width:38px;height:38px;border-radius:50%;background:var(--purple-600);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .dm-info{flex:1;min-width:0;display:flex;flex-direction:column;}
  .dm-info b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dm-preview{font-size:11.5px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dm-badge-inline{background:#DC2626;color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;}
  .breadcrumb-bar{padding:8px 22px;font-size:11.5px;color:var(--gray-500);background:#fff;border-bottom:1px solid var(--gray-300);}
  .breadcrumb-bar span{cursor:pointer;}
  .breadcrumb-bar span:hover{color:var(--purple-600);text-decoration:underline;}
  @media (max-width:980px){
    .topbar{padding:8px 12px;gap:8px;}
    .brand{font-size:16px;}
    .alert-chip{max-width:52vw;overflow:hidden;font-size:10.5px;padding:6px 10px;min-width:0;}
    .session-select{font-size:0;gap:0;} /* oculta el texto "Sesión rápida:" pero no el <select>, que tiene su propio font-size */
    .session-select select{font-size:12px;padding:6px 8px;max-width:34vw;}
  }

  .app-body{display:flex;gap:22px;padding:22px;max-width:1500px;margin:0 auto;width:100%;flex:1;align-items:flex-start;}
  @media (max-width: 980px){ .app-body{flex-direction:column;padding:12px;gap:12px;padding-bottom:78px;} }

  /* ===== Barra de pestañas móvil (Corcho / Explorar) ===== */
  .mobile-tabbar{display:none;}
  @media (max-width: 980px){
    .mobile-tabbar{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
      background:#fff;border-top:1px solid var(--gray-300);box-shadow:0 -2px 10px rgba(0,0,0,.06);
    }
    .mobile-tabbar button{
      flex:1;border:none;background:none;padding:10px 4px 8px;font-size:11px;font-weight:700;color:var(--gray-500);
      display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;
    }
    .mobile-tabbar button.active{color:var(--purple-600);}
    .mobile-tabbar button .ic{font-size:19px;}
    .app-body.show-corcho .right-panel{display:none;}
    .app-body.show-explorar .corcho-wrap{display:none;}
    .app-body.show-explorar .right-panel{width:100%;}
  }
  @media (min-width: 981px){
    .app-body.show-corcho .right-panel, .app-body.show-explorar .corcho-wrap{display:block;}
  }

  /* ===== EL CORCHO ===== */
  .corcho-wrap{
    flex:0 0 400px;max-width:400px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px),
      radial-gradient(circle at 20% 15%, #dcb478, #cda46a 40%, #b8894f 100%);
    border:10px solid var(--wood);border-radius:18px;
    box-shadow:0 14px 30px rgba(60,35,10,.25), inset 0 0 40px rgba(70,40,10,.25);
    padding:16px;position:relative;
  }
  @media (max-width: 980px){ .corcho-wrap{flex:1;max-width:100%;} }
  .corcho-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--wood-dark);}
  .corcho-back{background:none;border:none;font-size:18px;color:var(--wood-dark);}
  .corcho-title{font-family:var(--font-display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px;}
  .corcho-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .corcho-tabs button{
    border:none;background:rgba(255,255,255,.55);color:var(--wood-dark);font-weight:700;font-size:11.5px;
    padding:7px 11px;border-radius:8px;white-space:nowrap;display:flex;gap:5px;align-items:center;
  }
  .corcho-tabs button.active{background:var(--wood-dark);color:#fff;}
  @media (max-width:980px){ .corcho-tabs button{padding:10px 13px;font-size:12.5px;min-height:40px;} }
 .notes-grid{display:grid;grid-template-columns:1fr;gap:12px;min-height:280px;padding-bottom:20px;}
  @media (max-width:480px){ .notes-grid{grid-template-columns:1fr;} }
  .sticky{
    border-radius:6px;padding:12px 12px 10px;position:relative;
    box-shadow:0 6px 10px rgba(40,25,5,.22);font-size:12.3px;color:#3a2e12;
    transform:rotate(var(--rot,0deg));
  }
  .sticky:nth-child(4n+1){--rot:-1.5deg;background:var(--sticky-yellow);}
  .sticky:nth-child(4n+2){--rot:1.2deg;background:var(--sticky-purple);}
  .sticky:nth-child(4n+3){--rot:-1deg;background:var(--sticky-green);}
  .sticky:nth-child(4n+4){--rot:1.6deg;background:var(--sticky-blue);}
  .sticky .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:16px;}
  .sticky-badge{
    position:absolute;top:8px;right:8px;background:var(--wood-dark);color:#fff;font-size:9px;font-weight:800;
    padding:2px 7px;border-radius:5px;letter-spacing:.03em;
  }
  .sticky h4{margin:6px 26px 6px 0;font-size:13.5px;font-family:var(--font-display);font-weight:700;}
  .sticky p{margin:0 0 8px;line-height:1.35;opacity:.85;}
  .sticky .meta{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;opacity:.65;font-weight:700;}
  .sticky .time{font-size:9.5px;opacity:.55;display:block;margin-top:2px;}
  .sticky-cta{
    margin-top:8px;border:none;border-radius:6px;padding:5px 10px;font-size:10.5px;font-weight:800;color:#fff;
    background:var(--purple-600);
  }
  .sticky-cta.done{background:var(--green);}
  .fab{
   .fab{
  position:fixed;bottom:30px;right:30px;width:56px;height:56px;border-radius:50%;
  background:var(--purple-700);color:#fff;border:none;font-size:22px;box-shadow:0 8px 18px rgba(60,20,110,.4);
  z-index:100;cursor:pointer;transition:.15s;
}
.fab:hover{background:var(--purple-600);transform:scale(1.05);}
  }
  /* =========================================================
     v3.9 — BADGES DE ESTADO, CANAL Y UI DE APROBACIONES
     ========================================================= */
  .nota-badges{
    position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:78%;
  }
  .nb{
    font-size:8.5px;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:5px;
    color:#fff;background:var(--wood-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .nb-aprobada{background:#15803D;}
  .nb-pendiente{background:#B45309;}
  .nb-rechazada{background:#B91C1C;}
  .nb-directiva{background:#4C1D95;}
  .nb-miembros{background:#0E7490;}
  .nb-alcance{background:#3F3F46;}
  .sticky.es-propuesta{outline:2px dashed #B45309;outline-offset:-4px;}
  .sticky.es-rechazada{outline:2px dashed #B91C1C;outline-offset:-4px;}
  /* Cajón de aprobaciones / mis propuestas */
  .apro-inbox{
    background:#fff;border:1.5px solid #E3D3A3;border-radius:14px;padding:12px 14px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(20,20,40,.05);
  }
  .apro-inbox-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .apro-inbox-title{font-family:var(--font-display);font-weight:800;font-size:13.5px;color:var(--wood-dark);}
  .apro-count{
    background:#B45309;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:2px 8px;
  }
  .apro-item{
    display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #F0EAD8;
  }
  .apro-item:first-of-type{border-top:none;}
  .apro-item .ai-body{flex:1;min-width:0;}
  .apro-item .ai-tit{font-weight:700;font-size:12.5px;color:#2b2b38;margin-bottom:2px;}
  .apro-item .ai-sub{font-size:10.5px;color:#6b7280;line-height:1.4;}
  .apro-item .ai-motivo{
    font-size:10.5px;color:#B91C1C;background:#FEF2F2;border-radius:7px;padding:5px 8px;margin-top:5px;
  }
  .apro-acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .btn-aprobar{
    background:#15803D;color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:11px;
    font-weight:800;cursor:pointer;
  }
  .btn-aprobar:hover{background:#166534;}
  .btn-rechazar{
    background:#fff;color:#B91C1C;border:1.5px solid #FCA5A5;border-radius:7px;padding:5px 11px;
    font-size:11px;font-weight:800;cursor:pointer;
  }
  .btn-rechazar:hover{background:#FEF2F2;}
  .btn-reenviar{
    background:var(--purple-600);color:#fff;border:none;border-radius:7px;padding:6px 12px;
    font-size:11px;font-weight:800;cursor:pointer;
  }
  .btn-reenviar:hover{background:var(--purple-700);}
  .apro-vacio{font-size:11px;color:#6b7280;padding:6px 0;}
  .tab-pill-alerta{
    background:#B45309 !important;color:#fff !important;position:relative;
  }
  .tab-pill-alerta .tab-n{
    background:#fff;color:#B45309;border-radius:8px;font-size:9.5px;font-weight:800;
    padding:0 5px;margin-left:5px;
  }
  /* Campana de avisos de la barra superior */
  .notif-btn{
    position:relative;background:none;border:none;font-size:17px;cursor:pointer;padding:4px 7px;border-radius:9px;
  }
  .notif-btn:hover{background:rgba(0,0,0,.05);}
  .notif-badge{
    position:absolute;top:-2px;right:-1px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:700;
    min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    padding:0 4px;box-sizing:border-box;
  }
  .notif-menu{
    position:absolute;top:52px;right:14px;width:290px;max-width:calc(100vw - 28px);max-height:60vh;overflow-y:auto;
    background:#fff;border-radius:13px;box-shadow:0 10px 30px rgba(20,20,40,.22);z-index:300;display:none;padding:6px;
  }
  .notif-menu.abierto{display:block;}
  .notif-item{padding:9px 11px;border-radius:9px;font-size:11.5px;line-height:1.4;}
  .notif-item.no-leida{background:#FFF7ED;}
  .notif-item .ni-tit{font-weight:800;color:#2b2b38;margin-bottom:2px;}
  .notif-item .ni-cuerpo{color:#6b7280;}
  .notif-item .ni-fecha{color:#9CA3AF;font-size:9.5px;margin-top:3px;}
  .notif-empty{padding:16px 11px;font-size:11.5px;color:#6b7280;text-align:center;}
  .mi-rol-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:#fff;
    border-radius:8px;padding:3px 8px;letter-spacing:.03em;
  }
  .corcho-empty{grid-column:1/3;text-align:center;padding:40px 10px;color:#5b4224;opacity:.6;font-size:12.5px;}

  /* ===== RIGHT PANEL ===== */
  .right-panel{flex:1;min-width:0;}
  .panel-card{background:#fff;border-radius:16px;padding:26px;box-shadow:0 2px 10px rgba(20,20,40,.05);}

/* ===== Menú de tres puntos en las notas ===== */
.nota-menu{
  position:absolute;top:6px;right:6px;z-index:5;
}
.nota-menu-btn{
  background:rgba(255,255,255,.7);border:none;width:22px;height:22px;
  border-radius:6px;font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--wood-dark);transition:.12s;
}
.nota-menu-btn:hover{background:#fff;}
.nota-menu-dropdown{
  position:absolute;top:26px;right:0;background:#fff;border:1px solid var(--gray-300);
  border-radius:8px;box-shadow:0 6px 20px rgba(20,10,40,.15);
  min-width:140px;padding:4px;display:none;z-index:10;
}
.nota-menu-dropdown.abierto{display:block;}
.nota-menu-item{
  padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;
  border-radius:6px;color:var(--gray-900);display:flex;align-items:center;gap:8px;
}
.nota-menu-item:hover{background:var(--purple-100);}
.nota-menu-item.danger{color:#B91C1C;}
.nota-menu-item.danger:hover{background:#FEE2E2;}

/* ===== Aviso de edición en las notas ===== */
.nota-editada-aviso{
  margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);
  display:flex;flex-wrap:wrap;gap:4px;
}
.edit-chip{
  display:inline-flex;align-items:center;gap:4px;
  background:#FEF3C7;color:#B45309;border:1px solid #FCD34D;
  border-radius:6px;padding:2px 7px;font-size:9.5px;font-weight:700;
}
.edit-chip .excl{font-weight:900;color:#DC2626;}

/* ===== Ficha de nota (lugar, fecha, hora) ===== */
.nota-ficha{
  display:flex;flex-direction:column;gap:3px;margin:6px 0 4px;
  font-size:11px;color:#5b4224;
}
.nota-ficha .fila{
  display:flex;align-items:center;gap:5px;
}
.nota-ficha .fila .label{font-weight:700;opacity:.75;}

/* ===== Botón "Leer más" ===== */
.leer-mas-btn{
  background:none;border:none;color:var(--purple-600);
  font-size:10.5px;font-weight:700;cursor:pointer;
  text-decoration:underline;padding:0;margin:2px 0 6px;
  display:inline-block;
}
.leer-mas-btn:hover{color:var(--purple-800);}

/* ===== Modal de lectura de nota (solo lectura) ===== */
.nota-lectura .modal-head{background:var(--wood);}
.nota-lectura .modal-body{padding:22px;}
.nota-lectura h3{font-family:var(--font-display);font-size:18px;color:var(--wood-dark);margin:0 0 8px;}
.nota-lectura .badge-tipo{
  display:inline-block;background:var(--wood-dark);color:#fff;
  font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:6px;
  letter-spacing:.04em;margin-bottom:12px;text-transform:uppercase;
}
.nota-lectura .cuerpo{font-size:13.5px;line-height:1.55;color:#3a2e12;margin:10px 0 16px;white-space:pre-wrap;}
.nota-lectura .ficha{
  display:flex;flex-direction:column;gap:8px;
  background:#FBF6E5;border-radius:10px;padding:12px 14px;
  font-size:12.5px;color:#5b4224;margin-bottom:16px;
}
.nota-lectura .ficha .fila{display:flex;align-items:center;gap:8px;}
.nota-lectura .ficha .fila .label{font-weight:700;opacity:.8;min-width:70px;}
.nota-lectura .meta-info{
  font-size:11px;color:var(--gray-500);text-align:center;
  padding-top:12px;border-top:1px dashed var(--gray-300);
}
/* ===== CALENDARIO PERSONAL ===== */
.calendario-wrap{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 2px 10px rgba(20,20,40,.05);
  margin-top:14px;
  width:100%;
}
/* Cuando el calendario está dentro del map-box, quitar fondo azul del contenedor */
.map-box .calendario-wrap{
  box-shadow:0 1px 6px rgba(20,20,40,.08);
}.cal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.cal-titulo{
  font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--purple-800);
  text-transform:capitalize;
}
.cal-nav{
  display:flex;gap:6px;
}
.cal-nav button{
  background:var(--gray-100);border:none;width:30px;height:30px;
  border-radius:8px;font-size:16px;cursor:pointer;color:var(--gray-700);
  display:flex;align-items:center;justify-content:center;
  transition:.12s;
}
.cal-nav button:hover{background:var(--purple-100);color:var(--purple-700);}

.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
}
.cal-dia-sem{
  text-align:center;font-size:10px;font-weight:800;color:var(--gray-500);
  padding:6px 0;text-transform:uppercase;letter-spacing:.04em;
}
.cal-dia{
  aspect-ratio:1/1;max-width:46px;margin:0 auto;background:var(--gray-100);border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:var(--gray-700);
  cursor:pointer;border:2px solid transparent;position:relative;
  transition:.12s;padding:2px;
}
.cal-dia.vacio{background:transparent;cursor:default;}
.cal-dia:not(.vacio):hover{border-color:var(--purple-300);}
.cal-dia.otros-meses{opacity:.35;}
.cal-dia.con-eventos{background:rgba(124,58,237,.15);color:var(--purple-800);}
.cal-dia.con-eventos.apuntado{background:var(--purple-600);color:#fff;}
.cal-dia.hoy{border:2px dashed var(--purple-500);}
.cal-dia.seleccionado{border:2px solid var(--gray-900);}
.cal-dia .num{line-height:1;}
.cal-dia .puntos{
  display:flex;gap:2px;margin-top:2px;height:5px;align-items:center;
}
.cal-dia .puntos span{
  width:4px;height:4px;border-radius:50%;background:var(--purple-600);
}
.cal-dia.apuntado .puntos span{background:#fff;}
.cal-dia .mas-eventos{
  font-size:8px;font-weight:800;color:var(--purple-700);margin-left:1px;
}
.cal-dia.apuntado .mas-eventos{color:#fff;}

.cal-eventos-dia{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--gray-300);
}
.cal-eventos-dia h4{
  font-size:12px;color:var(--gray-700);margin:0 0 10px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:800;
}
.cal-evento{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:#FBF6E5;border-radius:10px;margin-bottom:8px;
  cursor:pointer;transition:.12s;
}
.cal-evento:hover{background:#F5EAC8;}
.cal-evento.apuntado{background:rgba(124,58,237,.12);}
.cal-evento.apuntado:hover{background:rgba(124,58,237,.2);}
.cal-evento .ic{
  width:32px;height:32px;border-radius:8px;background:var(--purple-600);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.cal-evento .info{flex:1;min-width:0;}
.cal-evento .info b{font-size:12.5px;display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-evento .info span{font-size:10.5px;color:var(--gray-500);}
.cal-evento .cta{
  background:var(--purple-600);color:#fff;border:none;border-radius:6px;
  padding:5px 10px;font-size:10px;font-weight:800;cursor:pointer;
}
.cal-evento .cta.done{background:var(--green);}
.cal-vacio{
  text-align:center;padding:16px;font-size:11.5px;color:var(--gray-500);
}
  /* ===== MODALS ===== */
  .overlay{position:fixed;inset:0;background:rgba(20,10,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--paper-cream);border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  @media (max-width:600px){
    .overlay{padding:0;align-items:flex-end;}
    .modal{max-width:100%;width:100%;border-radius:16px 16px 0 0;max-height:92vh;}
    .mfield input, .mfield select, .mfield textarea{font-size:16px;padding:12px;} /* evita el zoom automático de iOS al escribir */
    .btn-send, .btn-cancel, .radio-pill{min-height:44px;}
  }
  .modal.plain{background:#fff;}
  .modal-head{background:var(--wood);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-weight:700;font-size:16px;}
  .modal.plain .modal-head{background:var(--purple-700);}
  .modal-head button{background:none;border:none;color:#fff;font-size:18px;}
  .modal-body{padding:20px;}
  .mfield{margin-bottom:16px;}

<body>
<div id="root"></div>

<script>
/* =========================================================
   DATOS — jerarquía real de comunidades/provincias de España.
   Los grupos de Sevilla replican los nombres reales de la maqueta;
   el resto de grupos son ilustrativos (mismo patrón de numeración
   romana + barrio) porque no tengo acceso a internet en este entorno
   para verificar cada grupo oficial uno por uno.
   ========================================================= */
const AREA_COLORS = {FIS:'#D97706',INT:'#2563EB',SOC:'#15803D',ESP:'#7C3AED',PER:'#DB2777',EMO:'#DC2626'};

/* Nombres reales de asociaciones federadas leídos del "Mapa de AISG-España".
   Donde el escudo era ilegible se deja un nombre genérico (marcado ⚠ en el título del panel). */
const ASSOC_COMUNIDAD = {
  'Andalucía': 'AISG-Andalucía',
  'Aragón': 'AISG Aragón',
  'Extremadura': 'ASGAEX · Asoc. de Scouts y Guías Ambientales de Extremadura',
  'Madrid': 'ASGAM',
  'C. Valenciana': 'AVOGA',
};
const ASSOC_PROVINCIA = {
  'Sevilla': 'Asociación Sevillana de Escultismo Adulto',
  'Málaga': 'Scouts y Guías de Málaga',
};
function assocNameComunidad(c){ return ASSOC_COMUNIDAD[c] || `Junta Autonómica AISG ${c} ⚠`; }
function assocNameProvincia(p){ return ASSOC_PROVINCIA[p] || `Delegación Provincial AISG ${p} ⚠`; }

/* Opciones en cascada (Comunidad → Provincia → Grupo) para el formulario de
   registro, usando la misma estructura real TERRITORIOS que usa el resto
   de la app — así el desplegable siempre está al día con lo que haya. */
function comunidadOptionsHtml(){
  return Object.keys(TERRITORIOS).map(c=>`<option value="${c}">${c}</option>`).join('');
}
function provinciaOptionsHtml(comunidad){
  const t = TERRITORIOS[comunidad];
  if(!t || t.tipo!=='provincias') return '';
  return Object.keys(t.data).map(p=>`<option value="${p}">${p}</option>`).join('');
}
function grupoOptionsHtml(comunidad, provincia){
  const t = TERRITORIOS[comunidad];
  if(!t) return '';
  const list = t.tipo==='provincias' ? (t.data[provincia]||[]) : t.data;
  return list.map(g=>`<option value="${g.nombre}">${g.nombre}</option>`).join('');
}

/* =========================================================
   v3.9 — JERARQUÍA DE ROLES, ALCANCES Y CADENA DE APROBACIÓN
   ---------------------------------------------------------
   Seis roles jerárquicos (de abajo a arriba):
     0 miembro              · Miembro          — NO publica: solo lee y PROPONE
     1 coordinador_guilda   · Coordinador/a de Guilda  — publica en SU guilda
     2 presidente_grupo     · Presidente/a de Grupo    — publica en SU grupo
     3 ejecutiva_comunidad  · Ejecutiva de Comunidad   — publica en SU comunidad
     4 ejecutiva_nacional   · Ejecutiva Nacional       — publica a nivel global
     5 hermes               · Hermes (Red Nacional)    — publica a nivel global

   ALCANCES (a quién llega la nota). Los valores numéricos se mantienen
   igual que en v3.8.2 para no romper las notas ya guardadas en Supabase:
     0 = Guilda · 1 = Grupo · 2 = Provincia · 3 = Comunidad · 4 = Nacional · 5 = Global
   ========================================================= */
const ROLE_BY_SESSION = {
  scouter:'miembro', coord:'miembro', ejec_ccaa:'ejecutiva_comunidad',
  ejec_nac:'ejecutiva_nacional', hermes:'hermes',
  misev:'miembro', presi:'presidente_grupo', coordg:'coordinador_guilda',
};
const ROLE_LABELS = {
  miembro: 'Miembro',
  coordinador_guilda: 'Coordinador/a de Guilda',
  presidente_grupo: 'Presidente/a de Grupo',
  ejecutiva_comunidad: 'Ejecutiva de Comunidad',
  ejecutiva_nacional: 'Ejecutiva Nacional',
  hermes: 'Hermes (Red Nacional)',
};
/* Nombres cortos para los badges visuales del corcho. */
const ROLE_SHORT = {
  miembro: 'MIEMBRO',
  coordinador_guilda: 'COORD. GUILDA',
  presidente_grupo: 'PRESIDENTE/A',
  ejecutiva_comunidad: 'EJEC. COMUNIDAD',
  ejecutiva_nacional: 'EJEC. NACIONAL',
  hermes: 'HERMES',
};
/* Color del badge de cada rol. */
const ROLE_COLOR = {
  miembro: '#0369A1',
  coordinador_guilda: '#0F766E',
  presidente_grupo: '#15803D',
  ejecutiva_comunidad: '#7C3AED',
  ejecutiva_nacional: '#B45309',
  hermes: '#B91C1C',
};
/* Texto de a quién hay que pedir aprobación según el rol (para los avisos). */
const ROLE_APPROVER = {
  miembro: 'tu Presidente/a de Grupo',
  coordinador_guilda: 'tu Presidente/a de Grupo',
  presidente_grupo: 'la Ejecutiva de tu Comunidad',
  ejecutiva_comunidad: 'la Ejecutiva Nacional',
};

/* Nivel máximo que cada rol puede publicar SIN necesidad de aprobación.
   OJO: `miembro` es -1 a propósito → no puede publicar nada directamente,
   todo lo que escriba nace como "propuesta" pendiente de aprobación. */
const ROLE_NIVEL_LIBRE = {
  miembro: -1,
  coordinador_guilda: 0,    // Guilda
  presidente_grupo: 1,      // Grupo
  ejecutiva_comunidad: 3,   // Comunidad
  ejecutiva_nacional: 5,    // Global
  hermes: 5,                // Global
};
const ROLE_FREE_LEVEL = ROLE_NIVEL_LIBRE; // alias de compatibilidad con v3.8.2

/* Etiquetas legibles de cada alcance (índice = nivelAlcance). */
const NIVEL_LABELS = ['Guilda','Grupo','Provincia','Comunidad','Hermes (Red Nacional)','Toda España (Global)'];

/* ¿Este rol es directiva? (ve el canal "Solo Directiva").
   Directiva = ejecutivas y presidentes, tal y como pide la especificación. */
function esRolDirectiva(rol){
  return rol === 'presidente_grupo' || rol === 'ejecutiva_comunidad'
      || rol === 'ejecutiva_nacional' || rol === 'hermes';
}

/* ¿Puede este rol escribir/proponer notas? */
function rolPuedeEscribir(rol){
  return Object.prototype.hasOwnProperty.call(ROLE_NIVEL_LIBRE, rol);
}
/* Rol/identidad/nombre efectivos: si hay una cuenta real (state.authProfile),
   manda ella; si no, se usa la sesión rápida de pruebas. Así todo el resto
   del código (permisos, chat, inscripciones...) funciona igual con ambas. */
function currentRole(){ return state.authProfile ? state.authProfile.rol : ROLE_BY_SESSION[state.quickRole]; }
function personaId(){ return state.authUser ? state.authUser.id : state.quickRole; }

/* Devuelve el array de "pisos" del ascensor: todos los sitios a los que
   pertenece el usuario actual. Se calcula en cada render a partir de
   state.authProfile (el grupo con el que te registraste) y state.membresias
   (las ejecutivas y guildas a las que te han añadido). */
function misPisos(){
  const pisos = [];
  const myPerfilId = state.authUser ? state.authUser.id : null;
  const myGrupo = state.authProfile && state.authProfile.grupo;

  // 1) Grupo principal (desde el perfil de registro)
  if(myGrupo){
    pisos.push({
      tipo: 'grupo',
      grupo: myGrupo,
      loc: state.authProfile.provincia || state.authProfile.comunidad || '',
      label: myGrupo,
      sublabel: state.authProfile.comunidad || '',
      icono: '🏠',
    });
  }

  // 2) Ejecutivas y guildas (desde la tabla membresias)
  if(myPerfilId){
    state.membresias
      .filter(m => String(m.perfil_id) === String(myPerfilId))
      .forEach(m => {
        if(m.tipo === 'ejecutiva'){
          pisos.push({
            tipo: 'ejecutiva',
            grupo: m.grupo,
            seccion: 'Ejecutiva',
            label: 'Ejecutiva',
            sublabel: m.grupo,
            icono: '⚖️',
          });
        } else if(m.tipo === 'guilda' && m.seccion){
          pisos.push({
            tipo: 'guilda',
            grupo: m.grupo,
            seccion: m.seccion,
            label: m.seccion,
            sublabel: m.grupo,
            icono: '🛡️',
          });
        }
      });
  }

  return pisos;
}
/* Va al piso "actual" del ascensor: si el usuario ha elegido uno en esta
   sesión (state.pisoActual), va a ese. Si no, va a su grupo por defecto. */
function irAPisoActual(){
  if(state.pisoActual){
    irAPiso(state.pisoActual);
    return;
  }
  const myGrupo = state.authProfile && state.authProfile.grupo;
  if(!myGrupo){ showToast('No tienes un grupo asignado'); return; }
  irAPiso({ tipo:'grupo', grupo: myGrupo });
}

function irAPiso(piso){
  if(!piso || !piso.grupo){ showToast('No se pudo encontrar ese destino'); return; }

  let encontrado = null;
  for(const [comunidad, t] of Object.entries(TERRITORIOS)){
    if(t.tipo === 'provincias'){
      for(const [provincia, lista] of Object.entries(t.data)){
        const g = lista.find(g => g.nombre === piso.grupo);
        if(g){ encontrado = { comunidad, provincia, grupo: g }; break; }
      }
    } else {
      const g = t.data.find(g => g.nombre === piso.grupo);
      if(g){ encontrado = { comunidad, provincia: null, grupo: g }; break; }
    }
    if(encontrado) break;
  }

  if(!encontrado){
    showToast('Ese grupo no se encontró en la estructura territorial');
    return;
  }

  state.comunidad = encontrado.comunidad;
  state.provincia = encontrado.provincia;
  state.grupo = { nombre: encontrado.grupo.nombre, loc: encontrado.grupo.loc };

  if(piso.tipo === 'grupo'){
    state.seccion = null;
    state.seccionTipo = null;
    irAPanel('grupo-detail');
  } else if(piso.tipo === 'ejecutiva'){
    state.seccionTipo = 'ejecutiva';
    state.seccion = 'Ejecutiva';
    state.seccionTab = 'lista';
    irAPanel('seccion-detail');
  } else if(piso.tipo === 'guilda'){
    state.seccionTipo = 'guilda';
    state.seccion = piso.seccion;
    state.seccionTab = 'lista';
    irAPanel('seccion-detail');
  }

  // Guardar el piso elegido como "actual" para esta sesión
  state.pisoActual = piso;
}
function displayName(){
  if(state.authProfile) return `${state.authProfile.nombre||'Yo'} (${ROLE_LABELS[state.authProfile.rol]||state.authProfile.rol})`;
  return QUICK_SESSIONS.find(q=>q.k===state.quickRole)?.label || 'Yo';
}
const SCOPE_LEVELS = ['Guilda','Grupo','Provincia','Comunidad','Hermes (Red Nacional)','Toda España (Global)'];
/* Identidad "real" de cada sesión rápida: a qué grupo/provincia/comunidad
   pertenece de verdad. Se usa para decidir qué avisos le llegan a cada uno
   (un miembro de un grupo NO debe ver los avisos de nivel "Grupo" de otro
   grupo distinto al suyo) y para rellenar el selector de Alcance con su
   propio grupo/provincia/comunidad en vez de lo que esté navegando.
   Las sesiones de Ejecutiva/Hermes no tienen un grupo fijo: ven todos los
   avisos sin importar su alcance u origen (ver notaVisibleParaSesion). */
const SESSION_CONTEXT = {
  scouter: { comunidad:'Andalucía', provincia:'Granada', grupo:'Asociación Granadina de Amigos del Escultismo (AGAE)' },
  coord:   { comunidad:'Andalucía', provincia:'Sevilla',  grupo:'Asociación Sevillana de Escultismo Adulto (ASDEA-AKELA)' },
  ejec_ccaa: { comunidad:'Andalucía', provincia:null, grupo:null },
  ejec_nac:  { comunidad:null, provincia:null, grupo:null },
  hermes:    { comunidad:null, provincia:null, grupo:null },
  // v3.9: sesiones rápidas para probar la cadena de aprobación COMPLETA.
  // OJO: `misev`, `coordg` y `presi` son del MISMO grupo (Sevilla) a propósito,
  // para poder recorrer el circuito entero: el miembro propone → el presidente
  // aprueba o rechaza → el miembro reenvía. Si se mezclan grupos distintos, el
  // presidente no verá la propuesta (y es lo correcto).
  misev:   { comunidad:'Andalucía', provincia:'Sevilla', grupo:'Asociación Sevillana de Escultismo Adulto (ASDEA-AKELA)' },
  presi:   { comunidad:'Andalucía', provincia:'Sevilla', grupo:'Asociación Sevillana de Escultismo Adulto (ASDEA-AKELA)' },
  coordg:  { comunidad:'Andalucía', provincia:'Sevilla', grupo:'Asociación Sevillana de Escultismo Adulto (ASDEA-AKELA)' },
};
/* Contexto "de casa" de la sesión activa: su propio grupo/provincia/comunidad.
   Si hay una cuenta real, se usa lo que ella tenga guardado; si no, cae en
   la sesión rápida de pruebas; y si tampoco hay nada fijo (ejecutivas/hermes),
   cae en lo que esté navegando en ese momento (state.grupo/provincia/comunidad). */
function homeCtx(){
  if(state.authProfile){
    return {
      grupo: state.authProfile.grupo || (state.grupo ? state.grupo.nombre : null),
      provincia: state.authProfile.provincia || state.provincia || null,
      comunidad: state.authProfile.comunidad || state.comunidad || null,
    };
  }
  const ctx = SESSION_CONTEXT[state.quickRole] || {};
  return {
    grupo: ctx.grupo || (state.grupo ? state.grupo.nombre : null),
    provincia: ctx.provincia || state.provincia || null,
    comunidad: ctx.comunidad || state.comunidad || null,
  };
}
/* ¿Le debe llegar esta nota a la sesión activa?
   - Hermes y cualquier Ejecutiva (autonómica o nacional) lo ven TODO.
   - Un miembro de grupo (scouter/coord) solo ve:
     · notas de "Grupo" publicadas por SU grupo,
     · notas de "Provincia"/"Comunidad" que incluyan su provincia/comunidad,
     · notas de "Hermes (Red Nacional)" o "Global", que llegan a todos.
   Las notas antiguas/manuales sin nivelAlcance se muestran a todos
   (son de ejemplo, no deben desaparecer por no tener este dato). */
/* Determina si la nota `n` es visible para la sesión actual.
   Modelo:
   - Hermes y Ejecutiva Nacional → ven TODO.
   - Resto: filtran por territorio (grupo/provincia/comunidad) y por canal.
   - canalDirectiva: true → solo ejecutivas (ni miembros).
   - Niveles: 1=Grupo, 2=Provincia, 3=Comunidad, 4=Nacional, 5=Global. */
/* Determina si la nota `n` es visible para la sesión actual.
   Modelo:
   - Hermes y Presidenta Nacional → ven TODO.
   - Resto: filtran por territorio (guilda/grupo/provincia/comunidad) y por canal.
   - canalDirectiva: true → solo directivas (no miembros ni coordinadores).
   - Niveles: 0=Guilda, 1=Grupo, 2=Provincia, 3=Comunidad, 4=Nacional, 5=Global. */
/* Devuelve true si el usuario actual puede publicar a un nivel concreto.
   Modelo:
   - Hermes / Nacional: todo.
   - Ejecutiva Provincial: hasta comunidad.
   - Presidente de Grupo: grupo + sus guildas.
   - Coordinador de Guilda: solo su guilda.
   - Miembro: NO publica (salvo en el chat de su guilda).
   Parámetros:
   - nivel: 0=guilda, 1=grupo, 2=provincia, 3=comunidad, 4=nacional, 5=global
   - origenGuilda: nombre de la guilda (si nivel===0)
   - origenGrupo: nombre del grupo (para nivel 0/1) */
function puedePublicarEn(nivel, origenGuilda, origenGrupo){
  const rol = currentRole();
  const hc = homeCtx();
  const libre = ROLE_NIVEL_LIBRE[rol];
  if(libre === undefined) return false;

  // OJO: el miembro tiene libre = -1, así que NUNCA publica directo en el
  // corcho. Pero SÍ puede proponer notas para su propio grupo/guilda: el
  // permiso de escritura es distinto del permiso de publicación directa
  // (ver calcularEstadoPropuesta, que decide si la nota nace aprobada
  // o pendiente de aprobación).
  const esMiembro = rol === 'miembro';

  // 1) Su propio grupo (o una guilda de su grupo).
  if(nivel <= 1){
    if(!esMiembro && libre < nivel) return false;
    if(nivel === 0){
      if(!origenGuilda) return false;
      return pertenezcoAGuilda(origenGrupo, origenGuilda);
    }
    return !origenGrupo || !hc.grupo || origenGrupo === hc.grupo;
  }

  // 2) Provincia: rango de provincia o superior, dentro de su comunidad.
  if(nivel === 2){
    if(libre < 2) return false;
    if(hc.comunidad && state.comunidad && state.comunidad !== hc.comunidad) return false;
    return true;
  }

  // 3) Comunidad: rango de comunidad o superior, en su propia comunidad.
  if(nivel === 3){
    if(libre < 3) return false;
    if(!hc.comunidad) return true;
    const destino = state.comunidad || hc.comunidad;
    return destino === hc.comunidad;
  }

  // 4) Nacional / Global: solo Ejecutiva Nacional y Hermes.
  if(nivel >= 4) return libre >= 5;

  return false;
}

/* Escapa texto que viene del usuario antes de meterlo en HTML. */
function esc(txt){
  return String(txt == null ? '' : txt)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Abrevia un nombre de grupo/guilda para que quepa en los badges. */
function nombreCorto(txt, max){
  const t = String(txt || '').trim();
  const m = max || 22;
  if(t.length <= m) return t;
  return t.slice(0, m - 1) + '…';
}

/* Etiqueta corta del alcance de una nota, para el badge del corcho. */
function etiquetaAlcance(n){
  const nivel = Number(n.nivelAlcance);
  if(!Number.isFinite(nivel)) return 'GENERAL';
  if(nivel === 0) return nombreCorto(n.origenGuilda || 'GUILDA', 20).toUpperCase();
  if(nivel === 1) return nombreCorto(n.origenGrupo || 'GRUPO', 20).toUpperCase();
  if(nivel === 2) return nombreCorto(n.origenProvincia || 'PROVINCIA', 20).toUpperCase();
  if(nivel === 3) return nombreCorto(n.origenComunidad || 'COMUNIDAD', 20).toUpperCase();
  if(nivel === 4) return 'RED NACIONAL';
  return 'GLOBAL';
}

/* ¿El usuario actual pertenece a esta guilda? Se mira primero la tabla de
   membresías (cuentas reales) y, si no hay cuenta, la guilda en la que estás
   navegando (sesiones rápidas de prueba). Definición ÚNICA en v3.9. */
function pertenezcoAGuilda(grupo, guilda){
  if(!grupo || !guilda) return false;
  const myId = miPerfilId();
  if(myId && state.membresias.some(m =>
      m.tipo === 'guilda' && m.grupo === grupo && m.seccion === guilda
      && String(m.perfil_id) === String(myId))) return true;
  return state.seccionTipo === 'guilda' && state.seccion === guilda
      && !!state.grupo && state.grupo.nombre === grupo;
}

/* =========================================================
   VISIBILIDAD DEL CORCHO
   ---------------------------------------------------------
   Canal "Miembros": llega a todo el territorio del alcance.
   Canal "Solo Directiva": llega SOLO a ejecutivas y presidentes del territorio.
   Las notas pendientes o rechazadas nunca se publican en el corcho general:
   solo las ven su autor y quien debe aprobarlas.
   ========================================================= */
function notaVisibleParaSesion(n){
  if(!n || notaNoPublicada(n)){
    // Sin publicar: solo el autor y los aprobadores (se pintan aparte).
    return esAutorDeNota(n) || puedeAprobarNota(n);
  }

  const rol = currentRole();
  const hc = homeCtx();
  const soloDirectiva = n.canalDirectiva === true;

  // Hermes y Ejecutiva Nacional lo ven absolutamente todo.
  if(rol === 'hermes' || rol === 'ejecutiva_nacional') return true;

  // Canal Solo Directiva → miembros y coordinadores de guilda no lo ven nunca.
  if(soloDirectiva && !esRolDirectiva(rol)) return false;

  // Notas antiguas sin alcance definido: visibles (compatibilidad v3.8.2).
  if(n.nivelAlcance === undefined || n.nivelAlcance === null) return true;

  const nivel = Number(n.nivelAlcance);

  // Alcance global / nacional: llega a todo el mundo por el canal que sea.
  if(nivel >= 4) return true;

  // --- Ejecutiva de Comunidad: ve su comunidad entera y todo lo de dentro ---
  if(rol === 'ejecutiva_comunidad'){
    if(!hc.comunidad) return true;
    return hc.comunidad === n.origenComunidad;
  }

  // --- Presidente/a de Grupo: su grupo (y las guildas de su grupo) ---
  if(rol === 'presidente_grupo'){
    if(nivel === 3){
      // Comunidad: solo si es la suya.
      return !hc.comunidad || hc.comunidad === n.origenComunidad;
    }
    if(nivel === 2) return hc.comunidad === n.origenComunidad;
    return hc.grupo === n.origenGrupo;
  }

  // --- Coordinador/a de Guilda: solo la comunidad/provincia/grupo del que forma parte ---
  if(rol === 'coordinador_guilda'){
    if(nivel === 3) return !hc.comunidad || hc.comunidad === n.origenComunidad;
    if(nivel === 2) return hc.comunidad === n.origenComunidad;
    if(nivel === 1) return hc.grupo === n.origenGrupo;
    // Nivel guilda: tiene que ser SU guilda.
    if(nivel === 0){
      if(!n.origenGuilda) return hc.grupo === n.origenGrupo;
      return pertenezcoAGuilda(n.origenGrupo, n.origenGuilda);
    }
    return false;
  }

  // --- Miembro: lee la comunidad, su provincia, su grupo y su guilda ---
  if(rol === 'miembro'){
    if(nivel === 3) return !hc.comunidad || hc.comunidad === n.origenComunidad;
    if(nivel === 2){
      if(hc.comunidad !== n.origenComunidad) return false;
      if(!hc.provincia || !n.origenProvincia) return true;
      return hc.provincia === n.origenProvincia;
    }
    if(nivel === 1) return hc.grupo === n.origenGrupo;
    if(nivel === 0){
      if(!n.origenGuilda) return hc.grupo === n.origenGrupo;
      return pertenezcoAGuilda(n.origenGrupo, n.origenGuilda);
    }
  }
  return false;
}

/* =========================================================
   CADENA DE APROBACIÓN (v3.9)
   ---------------------------------------------------------
   Miembro / Coordinador/a de Guilda  → aprueba el Presidente/a de su Grupo
   Presidente/a de Grupo              → aprueba la Ejecutiva de su Comunidad
   Ejecutiva de Comunidad             → aprueba la Ejecutiva Nacional
   Ejecutiva Nacional / Hermes        → publican sin aprobación
   ========================================================= */

/* ¿Está publicada esta nota, o sigue en el circuito de aprobación? */
function notaNoPublicada(n){
  if(!n) return false;
  const e = n.estado;
  return e === 'pendiente' || e === 'rechazada' || (!!n.pendiente && e !== 'aprobada');
}

/* ID del autor (cuenta real o sesión rápida de prueba). */
function idAutorNota(n){
  return n && (n.autorId != null ? String(n.autorId) : null);
}

/* ¿La escribió el usuario actual? */
function esAutorDeNota(n){
  if(!n) return false;
  const mi = personaId();
  if(mi && idAutorNota(n) === String(mi)) return true;
  return !!(n.autor && n.autor === displayName());
}

/* ¿Está esta nota esperando aprobación? */
function estaPendiente(n){
  if(!n) return false;
  if(n.estado) return n.estado === 'pendiente';
  return n.pendiente === true;
}

/* ¿Puede el usuario actual aprobar o rechazar esta nota?
   Reglas (v3.9):
   - La resuelve el escalón que toca según la cadena de aprobación.
   - Si ese escalón no aparece, la puede desatascar cualquiera con rango
     SUPERIOR y competencia territorial sobre la nota (una ejecutiva de la
     comunidad resuelve lo del presidente; nacional/Hermes resuelven todo).
   - Nadie aprueba su propia nota. */
function puedeAprobarNota(n){
  if(!n || !estaPendiente(n)) return false;
  if(esAutorDeNota(n)) return false;

  const rol = currentRole();
  const hc = homeCtx();
  const nivel = Number(n.nivelAlcance);
  const origen = n.origenGrupo || null;

  // Escalón que le toca por la cadena.
  const objetivo = n.aprobadorRol || ((Number.isFinite(nivel) && nivel >= 2)
    ? 'ejecutiva_comunidad'
    : 'presidente_grupo');

  // Hermes y la Ejecutiva Nacional pueden resolver cualquier propuesta.
  if(rol === 'hermes' || rol === 'ejecutiva_nacional') return true;

  // La Ejecutiva de Comunidad resuelve todo lo de su comunidad: tanto las
  // propuestas que le suben a ella como las que se quedaron en el presidente.
  if(rol === 'ejecutiva_comunidad'){
    if(!hc.comunidad) return true;
    if(n.origenComunidad) return hc.comunidad === n.origenComunidad;
    // Nota sin comunidad de origen: la resolvemos por el grupo/provincia.
    if(hc.grupo && origen) return hc.grupo === origen;
    return true;
  }

  // El Presidente/a de Grupo resuelve lo que le toca dentro de su grupo.
  if(rol === 'presidente_grupo'){
    if(objetivo !== 'presidente_grupo') return false; // eso es de la ejecutiva
    if(!hc.grupo || !origen) return false;
    return hc.grupo === origen;
  }

  // Coordinadores y miembros no aprueban nada.
  return false;
}

/* ¿Le toca al usuario actual resolver algo? (para el contador 🔔 del corcho) */
function propuestasPorAprobar(){
  return state.notas.filter(puedeAprobarNota);
}
/* Mis propuestas (pendientes, rechazadas o ya aprobadas). */
function misPropuestas(){
  return state.notas.filter(esAutorDeNota).slice().sort((a,b)=> Number(b.id) - Number(a.id));
}

/* Totales de notificaciones locales sin leer (aviso al aprobador). */
function misNotificaciones(){
  return (state.notifs && Array.isArray(state.notifs.items)) ? state.notifs.items : [];
}
function notifsNoLeidas(){
  return misNotificaciones().filter(x => !x.leida).length;
}
function guardarNotifs(){
  try{ localStorage.setItem('scoutpath_notifs_v39_' + personaId(), JSON.stringify(state.notifs || {items:[]})); }catch(e){}
}
function cargarNotifs(){
  try{
    const raw = localStorage.getItem('scoutpath_notifs_v39_' + personaId());
    state.notifs = raw ? JSON.parse(raw) : {items:[]};
  }catch(e){ state.notifs = {items:[]}; }
  if(!state.notifs || !Array.isArray(state.notifs.items)) state.notifs = {items:[]};
}
function marcarNotifsLeidas(){
  misNotificaciones().forEach(x => { x.leida = true; });
  guardarNotifs();
}

/* Añade una notificación local (evita duplicados por nota). */
function pushNotif(tipo, titulo, cuerpo, extra){
  if(!state.notifs || !Array.isArray(state.notifs.items)) state.notifs = {items:[]};
  const ref = extra && extra.noteId != null ? String(extra.noteId) : null;
  if(ref && state.notifs.items.some(x => x.noteId === ref && x.tipo === tipo)) return;
  state.notifs.items.unshift({
    id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6),
    tipo, titulo, cuerpo,
    fecha: new Date().toISOString(),
    leida: false,
    noteId: ref,
  });
  if(state.notifs.items.length > 50) state.notifs.items.length = 50;
  guardarNotifs();
}

/* Pinta una notificación roja de escritorio (si el navegador lo permite). */
function notificarEscritorio(titulo, cuerpo){
  try{
    if(typeof Notification === 'undefined') return;
    if(Notification.permission === 'granted'){
      new Notification(titulo, {body: cuerpo});
    }
  }catch(e){ /* silencio: es solo un extra */ }
}
function pedirPermisoNotificaciones(){
  try{
    if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }catch(e){}
}

/* Calcula el estado con el que nace (o se reenvía) una nota, según el rol de
   quien la escribe y el alcance al que apunta. Devuelve el parche a guardar.
   - Si el alcance supera su rango  → 'pendiente' (necesita aprobación).
   - Si está dentro de su rango     → 'aprobada' (se publica directamente). */
function calcularEstadoPropuesta(rolAutor, nivel){
  const aprobadorRol = nivel >= 2 ? 'ejecutiva_comunidad' : 'presidente_grupo';
  const libre = ROLE_NIVEL_LIBRE[rolAutor];
  const excede = (libre === undefined) || (nivel > libre);
  return {
    estado: excede ? 'pendiente' : 'aprobada',
    pendiente: !!excede,
    excedeRango: !!excede,
    aprobadorRol: excede ? aprobadorRol : null,
    motivoRechazo: null,
  };
}

/* Cambia el estado de una propuesta (aprobada / rechazada / pendiente).
   - Actualiza el estado local al instante (funciona sin conexión).
   - Intenta sincronizar con Supabase sin romper nada si aún no hay columnas. */
async function actualizarEstadoNota(notaId, datos, opts){
  const n = state.notas.find(x => String(x.id) === String(notaId));
  if(!n) return false;
  Object.assign(n, datos);
  render();
  const sincronizar = !(opts && opts.soloLocal);
  if(!sincronizar) return true;
  try{
    const res = await fetch(`${SUPABASE_NOTAS_REST}?id=eq.${notaId}`, {
      method: 'PATCH',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=minimal'}),
      body: JSON.stringify(notaAPayload(datos)),
    });
    if(!res.ok){
      const body = await res.text();
      n._syncPendiente = true;
      warnCloudFail(`Estado de la nota (${res.status}): ${body.slice(0,140)}`);
      // Si el fallo es que faltan las columnas nuevas, lo decimos clarito:
      // así se entiende que hay que pegar el SQL de la v3.9 en Supabase.
      if(res.status === 400 || res.status === 404 || body.includes('does not exist')){
        showToast('⚠ Faltan columnas en Supabase: pega el SQL de la v3.9');
      } else {
        showToast(`⚠ No se pudo sincronizar el estado (${res.status})`);
      }
      render();
    } else {
      n._syncPendiente = false;
      state.syncStatus = {ok:true, msg:'Sincronizado'};
      render();
    }
  }catch(e){
    n._syncPendiente = true;
    warnCloudFail('Estado de la nota');
    render();
  }
  return true;
}

/* Avisa (una sola vez por sesión) si hay propuestas cuyo estado no se pudo
   guardar en la nube. Normalmente significa que falta el SQL de la v3.9. */
let _avisoSyncMostrado = false;
function avisarNotasSinSincronizar(){
  const atascadas = state.notas.filter(n => n._syncPendiente).length;
  if(atascadas > 0 && !_avisoSyncMostrado){
    _avisoSyncMostrado = true;
    showToast('⚠ Hay cambios de aprobación sin guardar: revisa Supabase');
  }
}

/* ---- APROBAR ---- */
async function aprobarNota(notaId){
  const n = state.notas.find(x => String(x.id) === String(notaId));
  if(!n) return;
  if(!puedeAprobarNota(n)){ showToast('No puedes aprobar esta nota'); return; }
  const quien = displayName();
  await actualizarEstadoNota(notaId, {
    estado: 'aprobada',
    pendiente: false,
    motivoRechazo: null,
    aprobadaPor: quien,
    aprobadaEl: new Date().toISOString(),
  });
  // Aviso al autor: su nota ya está publicada.
  pushNotif('aprobada', '✅ Nota aprobada',
    `"${n.titulo}" ya está publicada en el corcho (${NIVEL_LABELS[Number(n.nivelAlcance)] || 'corcho'}).`,
    {noteId: n.id});
  notificarEscritorio('✅ Tu nota fue aprobada', n.titulo);
  showToast('Nota aprobada y publicada ✓');
}

/* ---- RECHAZAR (con motivo) ---- */
function abrirModalRechazo(notaId){
  state.rechazoNotaId = notaId;

  render();
}
async function confirmarRechazo(){
  const notaId = state.rechazoNotaId;

  if(!n){ state.modal = null; render(); return; }
  const ta = document.getElementById('motivo-rechazo');

  await actualizarEstadoNota(notaId, {

    motivoRechazo: motivo,
    rechazadaPor: displayName(),
    rechazadaEl: new Date().toISOString(),
  });
  pushNotif('rechazada', '⛔ Propuesta rechazada',
    `"${n.titulo}" volvió a ti. Motivo: ${motivo}`, {noteId: n.id});
  notificarEscritorio('⛔ Tu propuesta fue rechazada', n.titulo);

  state.rechazoNotaId = null;

}

/* ---- REENVIAR una nota rechazada ---- */
async function reenviarPropuesta(notaId){
  const n = state.notas.find(x => String(x.id) === String(notaId));
  if(!n) return;
  if(!esAutorDeNota(n)){ showToast('Solo su autor puede reenviarla'); return; }
  const nivel = Number(n.nivelAlcance);
  const rol = currentRole();
  const libre = ROLE_NIVEL_LIBRE[rol];
  if(libre === undefined || nivel > libre){
    await actualizarEstadoNota(notaId, {
      estado: 'pendiente', pendiente: true,
      aprobadorRol: nivel >= 2 ? 'ejecutiva_comunidad' : 'presidente_grupo',
      motivoRechazo: null,
      reenviadaEl: new Date().toISOString(),
    });
    showToast(`Propuesta reenviada a ${ROLE_APPROVER[rol] || 'tu responsable'}`);
  } else {
    await actualizarEstadoNota(notaId, {
      estado: 'aprobada', pendiente: false, motivoRechazo: null,
    });
    showToast('Publicada en el corcho ✓');
  }
}
function grupo(nombre, loc, miembros, extra){ return {nombre, loc, miembros, extra: extra||''}; }

/* Datos reales del Acta de Asamblea Extraordinaria AISG España (1/02/2025).
   En AISG cada "grupo" a nivel provincial es, en realidad, la asociación adulta
   federada de esa provincia (AISG es una federación de asociaciones de scouts/guías
   adultos, no de grupos juveniles clásicos). */
function genGrupos(provName, n, seed){
  const romans=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
  const arr=[];
  for(let i=0;i<n;i++){
    arr.push(grupo(`Grupo Scout ${romans[i%10]}`, provName, 18+((seed+i*7)%30)));
  }
  return arr;
}

const ANDALUCIA_PROVINCIAS = {

/* Genera una posición ligeramente distinta pero SIEMPRE la misma para cada
   nombre (para no dar saltos en el mapa entre refrescos). */
function jitterCoord([lat,lng], seedStr, radio=0.045){
  let h=0; for(const c of seedStr) h=(h*31 + c.charCodeAt(0))|0;
  const a = ((Math.abs(h)%1000)/1000 - 0.5) * radio * 2;
  const b = ((Math.abs(h>>3)%1000)/1000 - 0.5) * radio * 2;
  return [lat+a, lng+b];
}

/* =========================================================
   MAPA REAL (Leaflet + OpenStreetMap)
   Dos capas según el zoom, igual que en Google Maps / Pokémon GO:
   - Zoom bajo (región): un pin por comunidad/provincia/grupo.
   - Zoom alto (calle, >=14): además aparecen los "Locales" (sede
     oficial y comercios/edificios afiliados) como marcador morado
     con una flor de lis, superpuesto sobre el mapa normal (los
     edificios de alrededor se ven en el gris/beige de siempre,
     sin tocar nada del estilo base del mapa).
   ========================================================= */
let currentLeafletMap = null;
let localesLayerGroup = null;
const LOCALES_ZOOM_MIN = 14;

function destroyLeafletMap(){
  if(currentLeafletMap){ currentLeafletMap.remove(); currentLeafletMap=null; localesLayerGroup=null; }
}
function pinDivIcon(color, glyph, size=30){
  return L.divIcon({
    className:'',
    html:`<div style="width:${size}px;height:${size}px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;">
      <span style="transform:rotate(45deg);font-size:${size*0.5}px;line-height:1;">${glyph}</span></div>`,
    iconSize:[size,size], iconAnchor:[size/2,size], popupAnchor:[0,-size],
  });
}
function localIcon(){ return pinDivIcon('#7C3AED','⚜️',30); }

function baseMap(containerId, center, zoom){
  destroyLeafletMap();
  const map = L.map(containerId, {zoomControl:true}).setView(center, zoom, {animate:false});
  L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'Map <a href="https://wikimediafoundation.org/wiki/Maps_Terms_of_Use" target="_blank">Wikimedia</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }).addTo(map);
  currentLeafletMap = map;
  return map;
}
/* Añade la capa de Locales (oculta hasta que se hace zoom de calle) para
   los grupos indicados. Se actualiza sola al mover/hacer zoom en el mapa. */
function attachLocalesLayer(map, nombresGrupo){
  localesLayerGroup = L.layerGroup().addTo(map);
  const avisoControl = L.control({position:'bottomleft'});
  avisoControl.onAdd = function(){
    const div = L.DomUtil.create('div');
    div.innerHTML = `<div style="background:#fff;padding:4px 8px;border-radius:6px;font-size:10.5px;box-shadow:0 1px 4px rgba(0,0,0,.2);">🔍 Acércate para ver los Locales</div>`;
    return div;
  };
  let avisoVisible = false;
  function refrescar(){
    localesLayerGroup.clearLayers();
    const zoomActual = map.getZoom();
    const hayLocales = localesDeGrupos(nombresGrupo).length>0;
    if(zoomActual < LOCALES_ZOOM_MIN){
      if(hayLocales && !avisoVisible){ avisoControl.addTo(map); avisoVisible=true; }
      if(!hayLocales && avisoVisible){ avisoControl.remove(); avisoVisible=false; }
      return;
    }
    if(avisoVisible){ avisoControl.remove(); avisoVisible=false; }
    localesDeGrupos(nombresGrupo).forEach(loc=>{
      const m = L.marker([loc.lat,loc.lng], {icon:localIcon()});
      const esSede = loc.tipo==='sede';
      m.bindPopup(`
        <div style="font-family:Inter,sans-serif;min-width:170px;">
          <b>${esSede?'🏠':'🤝'} ${loc.nombre}</b><br>
          <span style="font-size:11px;color:#666;">${esSede?'Sede oficial':'Comercio afiliado'}</span><br>
          <span style="font-size:11px;color:#666;">${loc.direccion||''}</span><br>
          <button onclick="if(confirm('¿Eliminar este Local?')) window.__deleteLocalDesdeMapa('${loc.id}')"
            style="margin-top:6px;background:#B91C1C;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;">🗑️ Eliminar</button>
        </div>`);
      localesLayerGroup.addLayer(m);
    });
  }
  map.on('zoomend moveend', refrescar);
  refrescar();
}
window.__deleteLocalDesdeMapa = function(id){ deleteLocal(id); };

function fitToPoints(map, coords, opciones){
  if(coords.length===0) return;
  if(coords.length===1){ map.setView(coords[0], (opciones&&opciones.zoomUnico)||13, {animate:false}); return; }
  map.fitBounds(L.latLngBounds(coords), {padding:[30,30], maxZoom:(opciones&&opciones.maxZoom)||12, animate:false});
}
function initMapaComunidad(){
  const map = baseMap('leaflet-map', [40.2,-3.7], 6);
  const coords = [];
  Object.entries(TERR_COORDS).forEach(([nombre,coord])=>{
    coords.push(coord);
    const activo = nombre===state.comunidad;
    L.marker(coord, {icon: pinDivIcon(activo?'#DC2626':'#7C3AED','📍',28)})
      .addTo(map).bindTooltip(nombre, {direction:'top'})
      .on('click', ()=>{
        state.comunidad = nombre;
        const t = TERRITORIOS[nombre];
        state.panel = t.tipo==='provincias' ? 'provincia' : 'grupo-list';
        render();
      });
  });
  fitToPoints(map, coords, {maxZoom:6});
}
function initMapaProvincia(){
  const centro = TERR_COORDS[state.comunidad] || [40.2,-3.7];
  const map = baseMap('leaflet-map', centro, 8);
  const t = TERRITORIOS[state.comunidad];
  const coords = [];
  Object.keys(t.data).forEach(nombre=>{
    const coord = PROV_COORDS[nombre] || jitterCoord(centro, nombre, 0.4);
    coords.push(coord);
    const activo = nombre===state.provincia;
    L.marker(coord, {icon: pinDivIcon(activo?'#DC2626':'#7C3AED','📍',28)})
      .addTo(map).bindTooltip(nombre, {direction:'top'})
      .on('click', ()=>{ state.provincia=nombre; irAPanel('grupo-list'); });
  });
  fitToPoints(map, coords, {zoomUnico:11, maxZoom:11});
}
function initMapaGrupos(){
  const t = TERRITORIOS[state.comunidad];
  const list = t.tipo==='provincias' ? t.data[state.provincia] : t.data;
  const centro = (state.provincia && PROV_COORDS[state.provincia]) || TERR_COORDS[state.comunidad] || [40.2,-3.7];
  const map = baseMap('leaflet-map', centro, 12);
  const coords = [];
  list.forEach((g,i)=>{
    const coord = jitterCoord(centro, g.nombre, 0.06);
    coords.push(coord);
    const activo = state.grupo && state.grupo.nombre===g.nombre;
    L.marker(coord, {icon: pinDivIcon(activo?'#DC2626':'#3B82F6','🛡️',30)})
      .addTo(map).bindTooltip(g.nombre, {direction:'top'})
      .on('click', ()=>{ state.grupo={nombre:g.nombre, loc:g.loc}; irAPanel('grupo-detail'); });
  });
  fitToPoints(map, coords, {zoomUnico:15, maxZoom:15});
  attachLocalesLayer(map, list.map(g=>g.nombre));
}
/* Se llama al final de cada render(): si la pantalla actual necesita mapa,
   lo (re)crea sobre el contenedor recién insertado en el DOM. */
function mountMapIfNeeded(){
  if(!document.getElementById('leaflet-map')){ destroyLeafletMap(); return; }
  if(state.panel==='comunidad') initMapaComunidad();
  else if(state.panel==='provincia') initMapaProvincia();
  else if(state.panel==='grupo-list') initMapaGrupos();
}

const provinciaMeta = {}; // key: "Comunidad||Provincia" -> {logo,colorPrimario,colorSecundario,instagram,twitter,tiktok,web}
function provKey(comunidad, provincia){ return `${comunidad}||${provincia}`; }

/* Fila de iconos con enlaces a las redes/web guardadas (reutilizable en cualquier tarjeta con meta) */
function redesIconsHtml(meta){
  if(!meta) return '';
  const clean = h => (h||'').trim().replace(/^@/,'');
  const links = [];
  if(meta.instagram) links.push({icon:'📷', url:`https://instagram.com/${clean(meta.instagram)}`, label:'Instagram'});
  if(meta.twitter) links.push({icon:'𝕏', url:`https://x.com/${clean(meta.twitter)}`, label:'X / Twitter'});
  if(meta.tiktok) links.push({icon:'🎵', url:`https://tiktok.com/@${clean(meta.tiktok)}`, label:'TikTok'});
  if(meta.web) links.push({icon:'🌐', url: /^https?:\/\//.test(meta.web)?meta.web:`https://${meta.web}`, label:'Web'});
  if(links.length===0) return '';
  return `<div class="redes-row" onclick="event.stopPropagation()">${links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" title="${l.label}">${l.icon}</a>`).join('')}</div>`;
}

async function saveProvinciaMeta(comunidad, provincia, meta){
  // Si el logo llega como base64 (data:...), lo subimos a Storage primero.
  if(meta.logo && String(meta.logo).startsWith('data:')){
    try{
      const blob = await (await fetch(meta.logo)).blob();

      if(blob.size > 500 * 1024){
        showToast('⚠ El logo pesa más de 500 KB. Prueba a comprimirlo.');
      }

      const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
      const path = `provincia_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

      const resUp = await fetch(`${SUPABASE_URL}/storage/v1/object/provincias/${path}`, {
        method: 'POST',
        headers: sbHeaders({
          'Content-Type': blob.type || 'image/png',
          'x-upsert': 'true',
        }),
        body: blob,
      });

      if(!resUp.ok){
        const body = await resUp.text();
        warnCloudFail(`Logo de provincia (${resUp.status}): ${body.slice(0,120)}`);
        return;
      }

      meta.logo = `${SUPABASE_URL}/storage/v1/object/public/provincias/${path}`;
    }catch(e){
      warnCloudFail('Logo de provincia: no se pudo subir');
      return;
    }
  }

  provinciaMeta[provKey(comunidad,provincia)] = Object.assign({}, getProvinciaMeta(comunidad,provincia), meta);

  const id = idMap.provincias[provKey(comunidad,provincia)];
  if(id!=null){
    sbUpdate(SUPABASE_PROVINCIAS_REST, id, {
      logo_url: meta.logo||null, color_primario: meta.colorPrimario||null, color_secundario: meta.colorSecundario||null,
      instagram: meta.instagram||null, twitter: meta.twitter||null, tiktok: meta.tiktok||null, web_url: meta.web||null,
    }).catch(()=>warnCloudFail('Guardar personalización de provincia'));
  }
}

function renameGrupo(comunidad, provincia, oldName, newName){

  if(!newName || !list) return false;
  const g = list.find(g=>g.nombre===oldName);
  if(!g || list.some(x=>x.nombre===newName)) return false;
  g.nombre = newName;

}
function deleteGrupo(comunidad, provincia, nombre){
  const list = grupoListRef(comunidad, provincia);

  if(state.grupo && state.grupo.nombre===nombre){ state.grupo=null; state.panel='grupo-list'; }

      const blob = await (await fetch(meta.icono)).blob();

      if(blob.size > 500 * 1024){
        showToast('⚠ El icono pesa más de 500 KB. Prueba a comprimirlo.');
      }

      const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
      const path = `guilda_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

      const resUp = await fetch(`${SUPABASE_URL}/storage/v1/object/guildas/${path}`, {
        method: 'POST',
        headers: sbHeaders({
          'Content-Type': blob.type || 'image/png',
          'x-upsert': 'true',
        }),
        body: blob,
      });

      if(!resUp.ok){
        const body = await resUp.text();
        warnCloudFail(`Icono de guilda (${resUp.status}): ${body.slice(0,120)}`);
        return;
      }

      meta.icono = `${SUPABASE_URL}/storage/v1/object/public/guildas/${path}`;
    }catch(e){
      warnCloudFail('Icono de guilda: no se pudo subir');
      return;
    }
  }

  guildaMeta[guildaKey(grupo,guilda)] = Object.assign({}, getGuildaMeta(grupo,guilda), meta);

  const id = idMap.guildas[guildaKey(grupo,guilda)];
  if(id!=null){
    sbUpdate(SUPABASE_GUILDAS_REST, id, {
      detalles: meta.detalles||null, tipo: meta.tipo||null, icono: meta.icono||null, color: meta.color||null,
    }).catch(()=>warnCloudFail('Guardar detalles de la guilda'));
  }
}function addGuilda(grupoNombre, nombre){
  nombre = (nombre||'').trim();
  const list = guildasDe(grupoNombre);
  if(!nombre || list.includes(nombre)) return false;
  list.push(nombre);
  guildaMiembrosDe(grupoNombre, nombre);
  const grupoId = idMap.grupos[grupoNombre];
  if(grupoId!=null){
    sbInsert(SUPABASE_GUILDAS_REST, {grupo_id:grupoId, nombre}).then(row=>{ idMap.guildas[grupoNombre+'||'+nombre]=row.id; }).catch(()=>warnCloudFail('Añadir guilda'));
  }
  return true;
}
function renameGuilda(grupoNombre, oldName, newName){
  newName = (newName||'').trim();
  const list = guildasDe(grupoNombre);
  if(!newName || list.includes(newName)) return false;
  const idx = list.indexOf(oldName);
  if(idx<0) return false;
  list[idx] = newName;
  const oldMiembros = state.guildaMiembros[grupoNombre+'||'+oldName];
  if(oldMiembros){ state.guildaMiembros[grupoNombre+'||'+newName] = oldMiembros; delete state.guildaMiembros[grupoNombre+'||'+oldName]; }
  const oldMeta = guildaMeta[guildaKey(grupoNombre,oldName)];
  if(oldMeta){ guildaMeta[guildaKey(grupoNombre,newName)]=oldMeta; delete guildaMeta[guildaKey(grupoNombre,oldName)]; }
  if(state.seccion===oldName) state.seccion=newName;
  const id = idMap.guildas[grupoNombre+'||'+oldName];
  if(id!=null){ sbUpdate(SUPABASE_GUILDAS_REST, id, {nombre:newName}).catch(()=>warnCloudFail('Renombrar guilda')); idMap.guildas[grupoNombre+'||'+newName]=id; delete idMap.guildas[grupoNombre+'||'+oldName]; }
  return true;
}
function deleteGuilda(grupoNombre, nombre){
  const list = guildasDe(grupoNombre);
  const idx = list.indexOf(nombre);
  if(idx>=0) list.splice(idx,1);
  delete state.guildaMiembros[grupoNombre+'||'+nombre];
  delete guildaMeta[guildaKey(grupoNombre,nombre)];
  if(state.seccion===nombre){ state.seccion=null; state.panel='grupo-detail'; }
  const id = idMap.guildas[grupoNombre+'||'+nombre];
  if(id!=null){ sbDelete(SUPABASE_GUILDAS_REST, id).catch(()=>warnCloudFail('Eliminar guilda')); delete idMap.guildas[grupoNombre+'||'+nombre]; }
}

/* =========================================================
   v3.9 — MAPA DE NOMBRES DE COLUMNA (tabla `notas`)
   ---------------------------------------------------------
   La tabla `notas` de Supabase mezcla convenciones: unas columnas son
   camelCase (`nivelAlcance`, `origenGrupo`) y otras snake_case
   (`canal_directiva`, `created_at`). En la v3.8.2 esto provocaba un fallo
   SILENCIOSO: la app intentaba guardar `canalDirectiva`, esa columna no
   existía y PostgREST la ignoraba, así que el canal elegido nunca se
   guardaba de verdad.
   Aquí declaramos la traducción en un solo sitio, para que el resto del
   código siga trabajando siempre en camelCase.
   ========================================================= */

/* camelCase (app) → nombre real de la columna en Postgres. */
const NOTA_COL = {
  canalDirectiva: 'canal_directiva',
  aprobadorRol: 'aprobador_rol',
  excedeRango: 'excede_rango',
  autorId: 'autor_id',
  autorNombre: 'autor_nombre',
  autorRol: 'autor_rol',
  aprobadaPor: 'aprobada_por',
  aprobadaEl: 'aprobada_el',
  rechazadaPor: 'rechazada_por',
  rechazadaEl: 'rechazada_el',
  motivoRechazo: 'motivo_rechazo',
  reenviadaEl: 'reenviada_el',
  creadaEl: 'creada_el',
  historial_ediciones: 'historial_ediciones',
  createdAt: 'created_at',
};
/* Nombre real de columna → camelCase (para lo que devuelve PostgREST). */
const NOTA_COL_INV = (()=>{
  const inv = {};
  Object.keys(NOTA_COL).forEach(k => { inv[NOTA_COL[k]] = k; });
  return inv;
})();

/* Convierte el objeto de la app al formato de columnas de la base de datos. */
function notaAPayload(n){
  const out = {};
  Object.keys(n || {}).forEach(k => {
    // No mandamos nunca los campos de control internos (empiezan por "_").
    if(k.charAt(0) === '_') return;
    out[NOTA_COL[k] || k] = n[k];
  });
  return out;
}
/* Convierte una fila de PostgREST al formato que usa la app. */
function filaANota(fila){
  if(!fila || typeof fila !== 'object') return fila;
  const out = Object.assign({}, fila);
  Object.keys(NOTA_COL_INV).forEach(dbName => {
    if(Object.prototype.hasOwnProperty.call(fila, dbName)){
      const appName = NOTA_COL_INV[dbName];
      if(appName !== dbName){ out[appName] = fila[dbName]; delete out[dbName]; }
    }
  });
  return out;
}
