/* "Se me ha olvidado la contraseña": Supabase manda un código de 6 dígitos
   por email (usa la plantilla "Reset Password" con {{ .Token }}, ver nota
   al usuario). Son 2 pasos: 1) pedir el envío, 2) verificar el código y
   entonces sí queda una sesión válida para poder cambiar la contraseña. */
async function authSolicitarCodigo(email){
  const res = await fetch(`${SUPABASE_AUTH_URL}/recover`, {
    method:'POST', headers:{apikey:SUPABASE_AUTH_KEY, Authorization:`Bearer ${SUPABASE_AUTH_KEY}`, 'Content-Type':'application/json'},
    body: JSON.stringify({email}),
  });
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    throw new Error(data.error_description || data.msg || 'No se pudo enviar el código');
  }
}
async function authVerificarCodigo(email, token){
  const res = await fetch(`${SUPABASE_AUTH_URL}/verify`, {
    method:'POST', headers:{apikey:SUPABASE_AUTH_KEY, Authorization:`Bearer ${SUPABASE_AUTH_KEY}`, 'Content-Type':'application/json'},
    body: JSON.stringify({email, token, type:'recovery'}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'Código incorrecto o caducado');
  return data; // trae access_token: ya hay sesión, ahora se puede cambiar la contraseña
}
async function authCambiarPassword(accessToken, nuevaPassword){
  const res = await fetch(`${SUPABASE_AUTH_URL}/user`, {
    method:'PUT', headers:{apikey:SUPABASE_AUTH_KEY, Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json'},
    body: JSON.stringify({password:nuevaPassword}),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.msg || 'No se pudo cambiar la contraseña');
  return data;
}
/* Busca el perfil de este usuario; si es la primera vez, lo crea con los
   valores por defecto indicados (rol/nombre/grupo elegidos en el formulario). */
async function fetchOrCreatePerfil(userId, accessToken, defaults){
  const headers = {apikey:SUPABASE_AUTH_KEY, Authorization:`Bearer ${accessToken}`};
  let res = await fetch(`${SUPABASE_PERFILES_REST}?id=eq.${userId}&select=*`, {headers});
  let rows = await res.json();
  if(Array.isArray(rows) && rows.length>0) return rows[0];
  res = await fetch(SUPABASE_PERFILES_REST, {
    method:'POST', headers:Object.assign({}, headers, {'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(Object.assign({id:userId}, defaults)),
  });
  rows = await res.json();
  if(!res.ok) throw new Error('No se pudo crear tu perfil. ¿Has ejecutado el SQL de la tabla "perfiles"?');
  return rows[0];
}
/* Trae TODOS los perfiles (cuentas reales) para poder cruzarlos con el
   grupo de cada uno y montar el roster de "Miembros" automáticamente.
   Requiere que la tabla "perfiles" tenga una política de LECTURA pública
   (ver nota al usuario); sin ella, esto simplemente no trae nada y la app
   sigue funcionando solo con las altas manuales, sin romperse. */
async function fetchPerfiles(silent){
  try{
    const res = await fetch(`${SUPABASE_PERFILES_REST}?select=id,nombre,rol,grupo,provincia,comunidad`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}` }
    });
    if(!res.ok) return;
    const rows = await res.json();
    if(Array.isArray(rows)) state.perfiles = rows;
    if(!silent && !state.modal) render();
  }catch(e){ /* sin red: seguimos con lo que haya en local */ }
}
let syncing = false;

/* Guarda el id real de Supabase de cada elemento, para poder editarlo/
   borrarlo luego con PATCH/DELETE por id en vez de reenviar todo. */
const idMap = { territorios:{}, provincias:{}, grupos:{}, guildas:{} };

function sbHeaders(extra){ return Object.assign({apikey:SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}`}, extra||{}); }
async function sbGet(url){
  const res = await fetch(url, {headers: sbHeaders()});
  if(!res.ok) throw new Error(`GET ${url} -> ${res.status}`);
  return res.json();
}
async function sbInsert(url, body){
  const res = await fetch(url, {method:'POST', headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}), body: JSON.stringify(body)});
  if(!res.ok) throw new Error(`POST ${url} -> ${res.status}: ${await res.text()}`);
  const rows = await res.json();
  return rows[0];
}
async function sbUpdate(url, id, body){
  const res = await fetch(`${url}?id=eq.${id}`, {method:'PATCH', headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=minimal'}), body: JSON.stringify(body)});
  if(!res.ok) throw new Error(`PATCH ${url} -> ${res.status}`);
}
async function sbDelete(url, id){
  const res = await fetch(`${url}?id=eq.${id}`, {method:'DELETE', headers: sbHeaders()});
  if(!res.ok) throw new Error(`DELETE ${url} -> ${res.status}`);
}
function warnCloudFail(accion){ showToast(`⚠ ${accion}: no se guardó en la nube (se quedó solo en este dispositivo)`); }

/* Carga territorios/provincias/grupos/guildas desde Supabase y reconstruye
   TERRITORIOS + provinciaMeta + state.guildasPorGrupo con esos datos.
   Si las tablas están vacías (primera vez), sube la estructura local (la
   del acta de AISG) como semilla, para que a partir de ahora Supabase
   mande y todo el mundo vea lo mismo. */
async function fetchEstructura(silent){
  try{
    const [terrRows, provRows, grupRows, guilRows] = await Promise.all([
      sbGet(`${SUPABASE_TERRITORIOS_REST}?select=*`),
      sbGet(`${SUPABASE_PROVINCIAS_REST}?select=*`),
      sbGet(`${SUPABASE_GRUPOS_REST}?select=*`),
      sbGet(`${SUPABASE_GUILDAS_REST}?select=*`),
    ]);
    if(!Array.isArray(terrRows) || terrRows.length===0){
      if(!state.estructuraSembrada){ state.estructuraSembrada = true; await seedEstructuraASupabase(); }
      return;
    }
    const provsPorTerr = {}, gruposPorProv = {}, gruposPorTerr = {}, guildasPorGrupoId = {};
    provRows.forEach(p=>{ (provsPorTerr[p.territorio_id]=provsPorTerr[p.territorio_id]||[]).push(p); });
    grupRows.forEach(g=>{
      if(g.provincia_id!=null) (gruposPorProv[g.provincia_id]=gruposPorProv[g.provincia_id]||[]).push(g);
      else (gruposPorTerr[g.territorio_id]=gruposPorTerr[g.territorio_id]||[]).push(g);
    });
    guilRows.forEach(gu=>{ (guildasPorGrupoId[gu.grupo_id]=guildasPorGrupoId[gu.grupo_id]||[]).push(gu); });

    const nuevoTerritorios = {};
    const nuevoGuildasPorGrupo = {};
    idMap.territorios={}; idMap.provincias={}; idMap.grupos={}; idMap.guildas={};
    Object.keys(provinciaMeta).forEach(k=>delete provinciaMeta[k]);
    Object.keys(grupoMeta).forEach(k=>delete grupoMeta[k]);
    Object.keys(territorioMeta).forEach(k=>delete territorioMeta[k]);
    Object.keys(guildaMeta).forEach(k=>delete guildaMeta[k]);

    function metaDeFilaGrupo(g){
      grupoMeta[g.nombre] = {logo:g.logo_url, instagram:g.instagram, twitter:g.twitter, tiktok:g.tiktok, web:g.web_url};
      return grupo(g.nombre, g.localidad, g.miembros_estimados||1);
    }

    terrRows.forEach(t=>{
      idMap.territorios[t.nombre] = t.id;
      territorioMeta[t.nombre] = {
        logo:t.logo_url, colorPrimario:t.color_primario, colorSecundario:t.color_secundario,
        instagram:t.instagram, twitter:t.twitter, tiktok:t.tiktok, web:t.web_url,
      };
      const provsDeEste = provsPorTerr[t.id] || [];
      if(provsDeEste.length>0){
        const data = {};
        provsDeEste.forEach(p=>{
          idMap.provincias[provKey(t.nombre,p.nombre)] = p.id;
          provinciaMeta[provKey(t.nombre,p.nombre)] = {
            logo:p.logo_url, colorPrimario:p.color_primario, colorSecundario:p.color_secundario,
            instagram:p.instagram, twitter:p.twitter, tiktok:p.tiktok, web:p.web_url,
          };
          data[p.nombre] = (gruposPorProv[p.id]||[]).map(g=>{
            idMap.grupos[g.nombre] = g.id;
            nuevoGuildasPorGrupo[g.nombre] = (guildasPorGrupoId[g.id]||[]).map(gu=>{
              idMap.guildas[g.nombre+'||'+gu.nombre] = gu.id;
              guildaMeta[guildaKey(g.nombre,gu.nombre)] = {detalles:gu.detalles, tipo:gu.tipo, icono:gu.icono, color:gu.color};
              return gu.nombre;
            });
            const gg = metaDeFilaGrupo(g); gg.loc = g.localidad||p.nombre; return gg;
          });
        });
        nuevoTerritorios[t.nombre] = {tipo:'provincias', data};
      } else {
        nuevoTerritorios[t.nombre] = {tipo:'grupos', data: (gruposPorTerr[t.id]||[]).map(g=>{
          idMap.grupos[g.nombre] = g.id;
          nuevoGuildasPorGrupo[g.nombre] = (guildasPorGrupoId[g.id]||[]).map(gu=>{
            idMap.guildas[g.nombre+'||'+gu.nombre] = gu.id;
            guildaMeta[guildaKey(g.nombre,gu.nombre)] = {detalles:gu.detalles, tipo:gu.tipo, icono:gu.icono, color:gu.color};
            return gu.nombre;
          });
          const gg = metaDeFilaGrupo(g); gg.loc = g.localidad||t.nombre; return gg;
        })};
      }
    });
    Object.keys(TERRITORIOS).forEach(k=>delete TERRITORIOS[k]);
    Object.assign(TERRITORIOS, nuevoTerritorios);
    Object.keys(state.guildasPorGrupo).forEach(k=>delete state.guildasPorGrupo[k]);
    Object.assign(state.guildasPorGrupo, nuevoGuildasPorGrupo);
    if(!silent && !state.modal) render();
  }catch(e){ /* sin red: seguimos con la estructura local que ya había */ }
}
async function seedEstructuraASupabase(){
  try{
    for(const [nombreTerr, t] of Object.entries(TERRITORIOS)){
      const terrRow = await sbInsert(SUPABASE_TERRITORIOS_REST, {nombre: nombreTerr});
      idMap.territorios[nombreTerr] = terrRow.id;
      if(t.tipo==='provincias'){
        for(const [nombreProv, gruposArr] of Object.entries(t.data)){
          const meta = getProvinciaMeta(nombreTerr, nombreProv) || {};
          const provRow = await sbInsert(SUPABASE_PROVINCIAS_REST, {
            territorio_id: terrRow.id, nombre: nombreProv,
            logo_url: meta.logo||null, color_primario: meta.colorPrimario||'#7C3AED',
            color_secundario: meta.colorSecundario||'#EDE4FC', instagram: meta.instagram||null,
            twitter: meta.twitter||null, tiktok: meta.tiktok||null, web_url: meta.web||null,
          });
          idMap.provincias[provKey(nombreTerr,nombreProv)] = provRow.id;
          for(const g of gruposArr){
            const gm = getGrupoMeta(g.nombre) || {};
            const grupoRow = await sbInsert(SUPABASE_GRUPOS_REST, {
              provincia_id: provRow.id, nombre:g.nombre, localidad:g.loc, miembros_estimados:g.miembros,
              logo_url: gm.logo||null, instagram: gm.instagram||null, twitter: gm.twitter||null, tiktok: gm.tiktok||null, web_url: gm.web||null,
            });
            idMap.grupos[g.nombre] = grupoRow.id;
            for(const nombreGuilda of guildasDe(g.nombre)){
              const guildaRow = await sbInsert(SUPABASE_GUILDAS_REST, {grupo_id: grupoRow.id, nombre: nombreGuilda});
              idMap.guildas[g.nombre+'||'+nombreGuilda] = guildaRow.id;
            }
          }
        }
      } else {
        for(const g of t.data){
          const gm = getGrupoMeta(g.nombre) || {};
          const grupoRow = await sbInsert(SUPABASE_GRUPOS_REST, {
            territorio_id: terrRow.id, nombre:g.nombre, localidad:g.loc, miembros_estimados:g.miembros,
            logo_url: gm.logo||null, instagram: gm.instagram||null, twitter: gm.twitter||null, tiktok: gm.tiktok||null, web_url: gm.web||null,
          });
          idMap.grupos[g.nombre] = grupoRow.id;
          for(const nombreGuilda of guildasDe(g.nombre)){
            const guildaRow = await sbInsert(SUPABASE_GUILDAS_REST, {grupo_id: grupoRow.id, nombre: nombreGuilda});
            idMap.guildas[g.nombre+'||'+nombreGuilda] = guildaRow.id;
          }
        }
      }
    }
  }catch(e){ console.warn('No se pudo sembrar la estructura inicial en Supabase', e); }
}


/* ---- NOTAS: cada una es su propia fila (evita que un dispositivo
   pise las notas del otro cuando ambos publican casi a la vez) ---- */
async function fetchNotas(silent){
  try{
    // A) Primera vez: como antes (las últimas 200). A partir de ahí, solo
    // pedimos las que tengan id mayor que la última que ya tenemos.
    const esPrimeraVez = !state.notasLastId;
    const url = esPrimeraVez
      ? `${SUPABASE_NOTAS_REST}?select=*&order=id.desc&limit=20`
      : `${SUPABASE_NOTAS_REST}?select=*&id=gt.${state.notasLastId}&order=id.asc&limit=500`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}` }
    });
    if(!res.ok){
      const body = await res.text();
      state.syncStatus = {ok:false, msg:`Error al leer notas (${res.status}): ${body.slice(0,120)}`};
      if(!silent && !state.modal) render();
      return;
    }
    const rows = await res.json();
    state.syncStatus = {ok:true, msg:'Sincronizado'};
    if(Array.isArray(rows) && rows.length>0){
      state.notasLastId = rows.reduce((m,r)=> Math.max(m, Number(r.id)||0), Number(state.notasLastId)||0);
      // Traducimos los nombres de columna de la base de datos a los que usa
      // la app (canal_directiva → canalDirectiva, etc.).
      const normalizadas = rows.map(filaANota);
      // Si es la primera vez, ya vienen en orden "más reciente primero".
      // Si es una diferencia, llegan en orden ascendente: las damos la
      // vuelta antes de ponerlas delante, para que siga habiendo las más
      // nuevas arriba del todo, igual que antes.
      state.notas = esPrimeraVez ? normalizadas : normalizadas.slice().reverse().concat(state.notas);
      // Aviso al usuario si alguna propuesta suya no se pudo sincronizar.
      avisarNotasSinSincronizar();
    }
    // Si la tabla aún está vacía (recién creada), no borramos las notas de
    // ejemplo locales: así el corcho nunca se ve vacío mientras nadie ha
    // publicado todavía nada de verdad.
    if(!silent && !state.modal) render();
  }catch(e){
    state.syncStatus = {ok:false, msg:'Sin conexión a internet o a Supabase'};
    if(!silent && !state.modal) render();
  }
}
/* Abre el modal de "Pinchar nota" en modo edición, precargando los datos actuales. */
function abrirModalEditarNota(notaId){
  const nota = state.notas.find(n => String(n.id) === String(notaId));
  if(!nota){ showToast('Nota no encontrada'); return; }

  state.editingNotaId = notaId;
  state.noteType = nota.tipo || 'aviso';
  state.adjuntosPendientes = [];
  state.modal = 'nota';
  render();

  setTimeout(()=>{
    const tituloInp = document.querySelector('.modal-body .mfield input[placeholder*="Recogida"]');
    const msgInp = document.querySelector('.modal-body textarea');
    const lugarInp = document.getElementById('nota-lugar');
    const fechaInp = document.getElementById('nota-fecha');
    const horaInp = document.getElementById('nota-hora');
    const alcanceSel = document.getElementById('sel-alcance');
    if(tituloInp) tituloInp.value = nota.titulo || '';
    if(msgInp) msgInp.value = nota.msg || '';
    if(lugarInp) lugarInp.value = nota.lugar || '';
    if(fechaInp) fechaInp.value = nota.fecha || '';
    if(horaInp) horaInp.value = nota.hora || '';

    // Alcance: si tu rol no puede publicar en el alcance original de la nota,
    // nos quedamos con la primera opción disponible en vez de dejar el
    // desplegable en blanco (el selector siempre conserva uno seleccionado).
    if(alcanceSel && nota.nivelAlcance != null){
      const quiere = String(nota.nivelAlcance);
      const existe = Array.from(alcanceSel.options).some(o => o.value === quiere);
      if(existe) alcanceSel.value = quiere;
      else if(alcanceSel.options.length) alcanceSel.selectedIndex = 0;
    }

    // Canal (v3.9): recordar si la nota era "Solo directiva".
    const quiereDirectiva = nota.canalDirectiva === true;
    document.querySelectorAll('input[name="canal-nota"]').forEach(r=>{
      r.checked = (r.value === 'directiva') === quiereDirectiva;
      const pill = r.closest('.radio-pill');
      if(pill) pill.classList.toggle('sel', r.checked);
    });
    // Refrescar también el aviso de aprobación con el alcance ya cargado.
    const hintEdit = document.getElementById('alcance-hint');
    if(hintEdit && alcanceSel){
      const lvl = parseInt(alcanceSel.value, 10);
      const libre = ROLE_NIVEL_LIBRE[currentRole()];
      hintEdit.textContent = (libre === undefined || lvl > libre)
        ? `⚠ Este alcance supera tu rango: la nota quedará pendiente de aprobación de ${ROLE_APPROVER[currentRole()] || 'un responsable'}.`
        : '✓ Puedes publicar directamente en este alcance con tu rango actual.';
      if(currentRole() === 'miembro'){
        hintEdit.textContent = `✍️ Tu propuesta la revisará ${ROLE_APPROVER.miembro}.`;
      }
    }

    const adjActuales = state.adjuntos.filter(a => String(a.nota_id) === String(notaId));
    adjActuales.forEach(a=>{
      state.adjuntosPendientes.push({
        id: a.id, nombre: a.nombre, tipo: a.tipo, datos: null, existente: true,
      });
    });
    pintarAdjuntosPendientes();
  }, 50);
}

/* Elimina una nota y sus adjuntos de Storage. */
async function eliminarNota(notaId){
  if(!confirm('¿Seguro que quieres eliminar esta nota? Se borrarán también sus adjuntos.')) return;

  const adjuntos = state.adjuntos.filter(a => String(a.nota_id) === String(notaId));
  for(const adj of adjuntos){
    try{
      const res = await fetch(`${SUPABASE_ADJUNTOS_REST}?id=eq.${adj.id}&select=storage_path`, {headers: sbHeaders()});
      const rows = await res.json();
      const path = rows && rows[0] && rows[0].storage_path;
      if(path){
        await fetch(`${SUPABASE_URL}/storage/v1/object/adjuntos/${path}`, {method:'DELETE', headers: sbHeaders()});
      }
    }catch(e){ /* si falla, seguimos */ }
  }

  await fetch(`${SUPABASE_ADJUNTOS_REST}?nota_id=eq.${notaId}`, {method:'DELETE', headers: sbHeaders()});
  await fetch(`${SUPABASE_NOTAS_REST}?id=eq.${notaId}`, {method:'DELETE', headers: sbHeaders()});

  state.notas = state.notas.filter(n => String(n.id) !== String(notaId));
  state.adjuntos = state.adjuntos.filter(a => String(a.nota_id) !== String(notaId));

  render();
  showToast('Nota eliminada');
}
async function insertNota(nota){

    });

      render();
      return;
    }
    state.syncStatus = {ok:true, msg:'Sincronizado'};
    render();
  }catch(e){
    state.syncStatus = {ok:false, msg:'Sin conexión a internet o a Supabase'};
    showToast('⚠ No se pudo sincronizar la nota (se guardó solo en este dispositivo)');
    render();
  }
}

/* ---- INSCRIPCIONES: quién se ha apuntado a qué evento/actividad, cada
   apunte en su propia fila (misma lógica que las notas: nada se pisa). ---- */
async function fetchInscripciones(silent){
  try{
    const esPrimeraVez = !state.inscripcionesLastId;
    const url = esPrimeraVez
      ? `${SUPABASE_INSCRIPCIONES_REST}?select=*&order=id.desc&limit=1000`
      : `${SUPABASE_INSCRIPCIONES_REST}?select=*&id=gt.${state.inscripcionesLastId}&order=id.asc&limit=1000`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}` }
    });
    if(!res.ok){
      // Si la tabla todavía no existe no rompemos la app; el botón de
      // Inscribirse simplemente seguirá funcionando solo en local.
      return;
    }
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length){
      state.inscripcionesLastId = rows.reduce((m,r)=> Math.max(m, Number(r.id)||0), Number(state.inscripcionesLastId)||0);
      state.inscripciones = esPrimeraVez ? rows : state.inscripciones.concat(rows);
    }
    if(!silent && !state.modal) render();
  }catch(e){ /* sin red: seguimos con lo que haya en local */ }
}
async function insertInscripcion(inscripcion){
  try{
    const res = await fetch(SUPABASE_INSCRIPCIONES_REST, {
      method:'POST',
      headers:{ apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}`, 'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify(inscripcion)
    });
    if(!res.ok){
      const body = await res.text();
      showToast(`⚠ No se guardó la inscripción en la nube: ${res.status}`);
      state.syncStatus = {ok:false, msg:`Error al guardar inscripción (${res.status}): ${body.slice(0,120)}`};
      render();
      return;
    }
    state.syncStatus = {ok:true, msg:'Sincronizado'};
    render();
  }catch(e){
    showToast('⚠ No se pudo sincronizar la inscripción (se guardó solo en este dispositivo)');
    state.syncStatus = {ok:false, msg:'Sin conexión a internet o a Supabase'};
    render();
  }
}
/* ---- ADJUNTOS: documentos/imágenes pegados o subidos al crear una nota.
   Igual que notas/inscripciones: cada adjunto es su propia fila, enlazada
   a la nota por nota_id. El archivo se guarda como Data URL (base64) en la
   columna "datos", así no hace falta configurar un bucket de almacenamiento
   aparte en Supabase — con una tabla normal basta. */
async function fetchAdjuntos(silent){
  try{
    const esPrimeraVez = !state.adjuntosLastId;
    const url = esPrimeraVez
      ? `${SUPABASE_ADJUNTOS_REST}?select=id,nota_id,nombre,tipo&order=id.desc&limit=500`
      : `${SUPABASE_ADJUNTOS_REST}?select=id,nota_id,nombre,tipo&id=gt.${state.adjuntosLastId}&order=id.asc&limit=500`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}` }
    });
    if(!res.ok) return; // si la tabla no existe todavía, seguimos sin adjuntos en vez de romper la app
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length){
      state.adjuntosLastId = rows.reduce((m,r)=> Math.max(m, Number(r.id)||0), Number(state.adjuntosLastId)||0);
      state.adjuntos = esPrimeraVez ? rows : state.adjuntos.concat(rows);
    }
    if(!silent && !state.modal) render();
  }catch(e){ /* sin red: seguimos con lo que haya en local */ }
}
async function fetchAdjuntoDatos(id){
  try{
    const res = await fetch(`${SUPABASE_ADJUNTOS_REST}?id=eq.${id}&select=datos`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${state.authToken || SUPABASE_KEY}` }
    });
    if(!res.ok) return null;
    const rows = await res.json();
    return (rows && rows[0]) ? rows[0].datos : null;
  }catch(e){ return null; }
}
async function insertAdjunto(adjunto){
  try{
    const blob = await (await fetch(adjunto.datos)).blob();
    const ext = (adjunto.nombre.match(/\.[^.]+$/) || [''])[0];
    const path = `${adjunto.nota_id}/${crypto.randomUUID()}${ext}`;
    const resUp = await fetch(`${SUPABASE_URL}/storage/v1/object/adjuntos/${path}`, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': adjunto.tipo || 'application/octet-stream', 'x-upsert': 'true' }),
      body: blob,
    });
    if(!resUp.ok){
      const body = await resUp.text();
      warnCloudFail(`Adjunto "${adjunto.nombre}" (${resUp.status}): ${body.slice(0,120)}`);
      return;
    }
    const res = await fetch(SUPABASE_ADJUNTOS_REST, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify({
        id: adjunto.id,
        nota_id: adjunto.nota_id,
        nombre: adjunto.nombre,
        tipo: adjunto.tipo,
        storage_path: path,
      }),
    });
    if(!res.ok){ warnCloudFail(`Adjunto "${adjunto.nombre}" (BD)`); return; }
  }catch(e){
    warnCloudFail(`Adjunto "${adjunto.nombre}"`);
  }
}

/* ============================================================
   MIGRACIÓN A STORAGE — Todo en uno.
   Recorre las 5 columnas que podrían contener base64 (data:...)
   y las sube al bucket correspondiente de Storage.
   ============================================================ */

async function _subirDataUrlABucket(dataUrl, bucket, prefijo){
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const ext = (blob.type.split('/')[1] || 'png').split('+')[0];
    const path = `${prefijo}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

    const resUp = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`, {
      method: 'POST',
      headers: sbHeaders({
        'Content-Type': blob.type || 'application/octet-stream',
        'x-upsert': 'true',
      }),
      body: blob,
    });
    if(!resUp.ok) return { error: `HTTP ${resUp.status}: ${(await resUp.text()).slice(0,150)}` };

    return { url: `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${path}` };
  }catch(e){
    return { error: e.message || String(e) };
  }
}

async function _patchYObtenerFila(restUrl, id, body){
  try{
    const res = await fetch(`${restUrl}?id=eq.${encodeURIComponent(id)}`, {
      method: 'PATCH',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify(body),
    });
    if(!res.ok){
      return { ok: false, error: `HTTP ${res.status}: ${(await res.text()).slice(0,150)}` };
    }
    const rows = await res.json();
    if(!Array.isArray(rows) || rows.length === 0){
      return { ok: false, error: 'UPDATE no afectó ninguna fila (¿RLS? ¿id inexistente?)' };
    }
    return { ok: true };
  }catch(e){
    return { ok: false, error: e.message || String(e) };
  }
}

async function migrarAdjuntos(log){
  const url = `${SUPABASE_ADJUNTOS_REST}?select=id,nombre,tipo,datos,nota_id&datos=not.is.null`;
  const res = await fetch(url, { headers: sbHeaders() });
  if(!res.ok){ log(`📦 Adjuntos: ❌ error ${res.status}`); return {ok:0, fail:0}; }
  const rows = await res.json();
  if(!rows.length){ log('📦 Adjuntos: ✅ 0 pendientes'); return {ok:0, fail:0}; }

  log(`📦 Adjuntos: ${rows.length} pendientes`);
  let ok = 0, fail = 0;
  for(const a of rows){
    const sub = await _subirDataUrlABucket(a.datos, 'adjuntos', `nota_${a.nota_id}`);
    if(sub.error){ log(`&nbsp;&nbsp;❌ "${a.nombre}" → ${sub.error}`); fail++; continue; }

    const storagePath = sub.url.replace(`${SUPABASE_URL}/storage/v1/object/public/adjuntos/`,'');
    const upd = await _patchYObtenerFila(SUPABASE_ADJUNTOS_REST, a.id, { storage_path: storagePath, datos: null });
    if(!upd.ok){ log(`&nbsp;&nbsp;❌ "${a.nombre}" → subido pero no actualizó: ${upd.error}`); fail++; continue; }

    log(`&nbsp;&nbsp;✅ "${a.nombre}"`);
    ok++;
  }
  return {ok, fail};
}

async function migrarTodo(){
  const out = document.getElementById('migrar-resultado');
  const log = (msg) => { if(out){ out.innerHTML += msg + '<br>'; } };
  if(out) out.innerHTML = '';

  log('🔎 Buscando base64 en toda la base de datos...');
  log('');

  let totalOk = 0, totalFail = 0;

  const rAdj = await migrarAdjuntos(log);       totalOk += rAdj.ok; totalFail += rAdj.fail;
  const rProv = await migrarProvincias(log);    totalOk += rProv.ok; totalFail += rProv.fail;

  const rLoc = await migrarLocales(log);        totalOk += rLoc.ok; totalFail += rLoc.fail;

  log('');
  if(totalOk === 0 && totalFail === 0){
    log('🎉 <b>Todo limpio. No hay nada que migrar.</b>');
  } else {
    log(`🎉 <b>Migración total: ${totalOk} OK · ${totalFail} fallos</b>`);
  }

  if(totalOk > 0) setTimeout(()=>fetchEstructura(true), 800);
}
/* ---- CHAT: un mensaje = una fila, igual que notas/inscripciones/adjuntos.
   Cada guilda/sección de cada grupo tiene su propio hilo, identificado por
   "seccion_key" = "<grupo>||<sección>" (misma idea que guildaMiembrosDe). */
function chatKey(){ return `${state.grupo? state.grupo.nombre : ''}||${state.seccion||''}`; }
function mensajesDeSeccion(key){ return state.chatMensajes.filter(m=> m.seccion_key===key); }

/* Carga los ÚLTIMOS 200 mensajes (los más nuevos), no los primeros.
   Es lo que el usuario espera ver al abrir un chat. */
async function fetchChat(silent){
  try{
    const url = `${SUPABASE_CHAT_REST}?select=id,seccion_key,autor,texto&order=id.desc&limit=20`;
    const res = await fetch(url, { headers: sbHeaders() });
    if(!res.ok) return;
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length){
      // Vienen en orden descendente (el más nuevo primero): les damos la vuelta
      // para dejarlos en orden cronológico ascendente (el más viejo primero).
      state.chatMensajes = rows.reverse();
      // Guardamos el id del mensaje MÁS ANTIGUO que tenemos en memoria.
      state.chatOldestId = state.chatMensajes[0]?.id ?? null;
    } else {
      state.chatMensajes = [];
      state.chatOldestId = null;
    }
    if(!silent && !state.modal) render();
  }catch(e){ /* sin red: seguimos con lo que haya en local */ }
}

/* Carga los 200 mensajes ANTERIORES al más antiguo que tenemos en pantalla.
   Se llama cuando el usuario sube el scroll hasta arriba del chat. */
async function cargarMasMensajes(){
  if(!state.chatOldestId) return;
  if(state.chatLoadingMore) return;
  state.chatLoadingMore = true;

  const cont = document.getElementById('chat-msgs');
  const alturaAntes = cont ? cont.scrollHeight : 0;

  try{
    const url = `${SUPABASE_CHAT_REST}?select=id,seccion_key,autor,texto&id=lt.${state.chatOldestId}&order=id.desc&limit=200`;
    const res = await fetch(url, { headers: sbHeaders() });
    if(!res.ok){ state.chatLoadingMore = false; return; }
    const rows = await res.json();
    if(!Array.isArray(rows) || rows.length === 0){
      state.chatOldestId = null;
      state.chatLoadingMore = false;
      return;
    }
    const anteriores = rows.reverse();
    state.chatMensajes = anteriores.concat(state.chatMensajes);
    state.chatOldestId = anteriores[0].id;
    refrescarChatSuave();
    if(cont){
      const alturaDespues = cont.scrollHeight;
      cont.scrollTop = alturaDespues - alturaAntes;
    }
  }catch(e){ /* sin red */ }
  state.chatLoadingMore = false;
}

/* ---- MENSAJES DIRECTOS (1-a-1) ---- */
let dmPollTimer = null;
function miPerfilId(){ return state.authUser ? state.authUser.id : null; }
function nombrePerfil(id){
  const p = state.perfiles.find(p => String(p.id) === String(id));
  return p ? (p.nombre || '(sin nombre)') : 'Cuenta eliminada';
}
/* Mensajes de la conversación entre yo y `otroId`, en orden cronológico
   (llegan ordenados del servidor; los optimistas se añaden al final). */
function mensajesDirectosCon(otroId){
  const me = miPerfilId();
  return state.mensajesDirectos.filter(m =>
    (m.de_id === me && m.para_id === otroId) || (m.de_id === otroId && m.para_id === me)
  );
}
function noLeidosDe(otroId){
  const me = miPerfilId();
  return state.mensajesDirectos.filter(m => m.para_id === me && m.de_id === otroId && !m.leido).length;
}
function totalNoLeidos(){
  const me = miPerfilId();
  if(!me) return 0;
  return state.mensajesDirectos.filter(m => m.para_id === me && !m.leido).length;
}
/* Conversaciones que ya tengo abiertas, ordenadas por el último mensaje. */
function conversacionesDm(){
  const me = miPerfilId();
  if(!me) return [];
  const ids = new Set();
  state.mensajesDirectos.forEach(m => {
    if(m.de_id === me && m.para_id !== me) ids.add(m.para_id);
    if(m.para_id === me && m.de_id !== me) ids.add(m.de_id);
  });
  return Array.from(ids).map(id => {
    const msgs = mensajesDirectosCon(id);
    const ultimo = msgs[msgs.length - 1];
    return { id, nombre: nombrePerfil(id), ultimoTexto: ultimo ? ultimo.texto : '', noLeidos: noLeidosDe(id), ts: ultimo ? (ultimo.id || 0) : 0 };
  }).sort((a,b) => b.ts - a.ts);
}
async function fetchMensajesDirectos(silent){
  const me = miPerfilId();
  if(!me) return;
  try{
    const url = `${SUPABASE_DM_REST}?select=id,de_id,para_id,texto,leido,creado&or=(de_id.eq.${me},para_id.eq.${me})&order=id.desc&limit=500`;
    const res = await fetch(url, { headers: sbHeaders() });
    if(!res.ok) return;
    const rows = await res.json();
    if(Array.isArray(rows)) state.mensajesDirectos = rows.reverse();
  }catch(e){ /* sin red */ }

  // Si tengo una conversación abierta, marco sus mensajes como leídos.
  if(state.modal === 'mensajesDirectos' && state.dmAbiertoCon){
    if(noLeidosDe(state.dmAbiertoCon) > 0) marcarDmLeidos(state.dmAbiertoCon);
  }
  pintarDm();
}
async function insertMensajeDirecto(msg){
  try{
    const res = await fetch(SUPABASE_DM_REST, {
      method: 'POST',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify(msg)
    });
    if(!res.ok){ warnCloudFail('Mensaje directo'); return null; }
    const rows = await res.json();
    return rows && rows[0];
  }catch(e){ warnCloudFail('Mensaje directo'); return null; }
}
async function marcarDmLeidos(otroId){
  const me = miPerfilId();
  if(!me) return;
  if(noLeidosDe(otroId) === 0) return; // nada que marcar
  state.mensajesDirectos.forEach(m => { if(m.para_id === me && m.de_id === otroId) m.leido = true; });
  pintarDm();
  try{
    await fetch(`${SUPABASE_DM_REST}?para_id=eq.${me}&de_id=eq.${otroId}&leido=is.false`, {
      method: 'PATCH',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=minimal'}),
      body: JSON.stringify({ leido: true })
    });
  }catch(e){ /* sin red: se marcará en la próxima pasada */ }
}
/* Actualiza el badge del topbar y, si el modal de DM está abierto, su contenido,
   SIN re-renderizar toda la app (para no perder el foco del input). */
function pintarDm(){
  const badge = document.getElementById('dm-badge');
  const n = totalNoLeidos();
  if(badge){
    if(n > 0){ badge.style.display = 'flex'; badge.textContent = n > 99 ? '99+' : n; }
    else badge.style.display = 'none';
  }
  if(state.modal === 'mensajesDirectos'){
    if(state.dmAbiertoCon){
      const cont = document.getElementById('dm-msgs');
      if(cont){
        const estabaAbajo = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 60;
        cont.innerHTML = dmHtml(mensajesDirectosCon(state.dmAbiertoCon));
        if(estabaAbajo) cont.scrollTop = cont.scrollHeight;
      }
    } else {
      const list = document.getElementById('dm-list');
      if(list){
        list.innerHTML = dmListaHtml();
        list.querySelectorAll('[data-dm-con]').forEach(b=>{
          b.onclick = ()=>{ state.dmAbiertoCon = b.dataset.dmCon; marcarDmLeidos(b.dataset.dmCon); render(); };
        });
      }
    }
  }
}

/* ---- MEMBRESIAS: pertenencia a Ejecutiva/Miembros/Guilda de un grupo.
   Cada fila es una persona en un sitio (tipo+grupo+seccion), guardando el
   ID de su perfil real (no el nombre copiado) cuando tiene cuenta — así si
   cambia su nombre se actualiza solo en todas partes, y una misma persona
   puede estar en tantas guildas/grupos como haga falta sin ningún límite
   ni conflicto (cada membresía es su propia fila, con su propio id).
   Si no tiene cuenta ("cuenta fantasma"), se guarda "nombre_manual". */
function membresiasDe(tipo, grupo, seccion){
  return state.membresias
    .filter(m=> m.tipo===tipo && m.grupo===grupo && (tipo!=='guilda' || m.seccion===seccion))
    .map(m=>{
      let nombre;
      if(m.perfil_id){
        const p = state.perfiles.find(pp=> pp.id===m.perfil_id);
        nombre = p ? (p.nombre||'(sin nombre)') : 'Cuenta eliminada';
      } else {
        nombre = m.nombre_manual || '(sin nombre)';
      }
      return { id:m.id, perfilId: m.perfil_id || null, nombre, cargo:m.cargo, esMembresia:true, conCuenta:!!m.perfil_id };
    });
}
async function fetchMembresias(silent){
  try{
    const res = await fetch(`${SUPABASE_MEMBRESIAS_REST}?select=*&order=id.asc&limit=5000`, {

/* Abre/descarga un adjunto ya publicado: como en fetchAdjuntos solo traemos
   metadatos (para no cargar cada 4s el contenido de todos los archivos),
   el contenido real (base64) se pide en el momento en que alguien quiere verlo. */
async function abrirAdjunto(id, nombre){
  showToast('Abriendo adjunto...');
  try{
    // 1) Preguntar a la tabla cuál es el path del archivo
    const res = await fetch(`${SUPABASE_ADJUNTOS_REST}?id=eq.${id}&select=storage_path`, {
      headers: sbHeaders()
    });
    const rows = await res.json();
    const path = rows && rows[0] && rows[0].storage_path;
    if(!path){
      showToast('⚠ Este adjunto es antiguo (base64) y no está en Storage.');
      return;
    }

    // 2) Construir la URL pública y abrirla/descargarla
    const url = `${SUPABASE_URL}/storage/v1/object/public/adjuntos/${path}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre || 'adjunto';
    a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    showToast('⚠ No se pudo cargar el adjunto.');
  }
}

   publicarla: subida por clic, arrastrar y soltar, o pegar (Ctrl+V). ---- */
const ADJUNTO_MAX_BYTES = 4 * 1024 * 1024; // 4MB: de sobra para un PDF/foto normal, sin reventar la fila en Supabase
function leerArchivoComoAdjunto(file, cb){
  if(!file) return;
  if(file.size > ADJUNTO_MAX_BYTES){ showToast(`⚠ "${file.name}" pesa demasiado (máx. 4MB).`); return; }
  const reader = new FileReader();
  reader.onload = ()=> cb({
    id: 'tmp'+Date.now()+Math.random().toString(36).slice(2),
    nombre: file.name || 'documento', tipo: file.type || 'application/octet-stream', datos: reader.result,
  });
  reader.onerror = ()=> showToast(`⚠ No se pudo leer "${file.name}".`);
  reader.readAsDataURL(file);
}

async function addLocal(local){
  // local = { grupo_id, nombre, tipo, direccion, lat, lng, foto_url }
  // foto_url aquí llega como Data URL (base64) desde el modal.
  // La subimos a Storage y guardamos solo el path + URL final.
  const tmpId = 'tmp'+Date.now();
  let fotoPath = null;
  let fotoUrlFinal = null;

  try{
    // 1) Si hay foto, subirla al bucket "locales"
    if(local.foto_url && local.foto_url.startsWith('data:')){
      const blob = await (await fetch(local.foto_url)).blob();
      const ext = (blob.type.split('/')[1] || 'jpg').split('+')[0];
      const path = `local_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

      const resUp = await fetch(
        `${SUPABASE_URL}/storage/v1/object/locales/${path}`,
        {
          method: 'POST',
          headers: sbHeaders({
            'Content-Type': blob.type || 'image/jpeg',
            'x-upsert': 'true',
          }),
          body: blob,
        }
      );
      if(!resUp.ok){
        const body = await resUp.text();
        warnCloudFail(`Foto del local (${resUp.status}): ${body.slice(0,120)}`);
        // seguimos sin foto, no bloqueamos el alta del local
      } else {
        fotoPath = path;
        fotoUrlFinal = `${SUPABASE_URL}/storage/v1/object/public/locales/${path}`;
      }
    } else if(local.foto_url){
      // Ya venía como URL (no base64), la dejamos tal cual
      fotoUrlFinal = local.foto_url;
    }

    // 2) Actualización local optimista (con la URL ya resuelta)
    const localFinal = Object.assign({}, local, {
      foto_url: fotoUrlFinal,
      foto_path: fotoPath,
    });
    const conId = Object.assign({id:tmpId}, localFinal);
    state.locales.unshift(conId);

    // 3) Guardar en la tabla (con URL, sin base64)
    const res = await fetch(SUPABASE_LOCALES_REST, {
      method:'POST',
      headers: sbHeaders({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify({
        grupo_id: local.grupo_id,
        nombre: local.nombre,
        tipo: local.tipo,
        direccion: local.direccion,
        lat: local.lat,
        lng: local.lng,
        foto_url: fotoUrlFinal,
        foto_path: fotoPath,
      })
    });
    if(!res.ok){ warnCloudFail('Añadir Local'); return; }
    const rows = await res.json();
    if(rows && rows[0]) conId.id = rows[0].id;
    render();
  }catch(e){ warnCloudFail('Añadir Local'); }
}
async function deleteLocal(id){
  // 1) Buscar el local ANTES de quitarlo de la lista,
  //    para saber si tenía foto en el Storage y borrarla también.
  const local = state.locales.find(l=> String(l.id)===String(id));

  // 2) Actualización local optimista (quitarlo de la lista y repintar)
  state.locales = state.locales.filter(l=> String(l.id)!==String(id));
  render();

  // 3) Si nunca llegó a guardarse en Supabase (id temporal), no hay nada que borrar en la nube
  if(String(id).startsWith('tmp')) return;

  try{
    // 4) Borrar la fila de la tabla
    const res = await fetch(`${SUPABASE_LOCALES_REST}?id=eq.${id}`, {
      method: 'DELETE',
      headers: sbHeaders()
    });
    if(!res.ok){ warnCloudFail('Eliminar Local'); }

    // 5) Y también borrar la foto del Storage (si la tenía)
    if(local && local.foto_path){
      await fetch(`${SUPABASE_URL}/storage/v1/object/locales/${local.foto_path}`, {
        method: 'DELETE',
        headers: sbHeaders()
      });
      // Si falla (por ejemplo, porque ya no existe), no hacemos nada: no es crítico.
    }
  }catch(e){ warnCloudFail('Eliminar Local'); }
}

/* B) Desacoplar estructura/locales del sondeo rápido de 4s: casi nunca
   cambian, así que en vez de volver a descargarlos sin parar, solo se
   refrescan al ENTRAR de verdad en la zona de "Explorar Grupos"(Comunidad,
   Provincia, lista de Grupos, detalle de Grupo). El resto del tiempo se
   queda con lo que ya tenía; para forzar una actualización hay que salir y
   volver a entrar, o recargar la página. */
/* Refresco "al entrar": cada panel pide lo suyo al abrirse.
   No hay ningún refresco por tiempo. */
function irAPanel(panel){
  state.panel = panel;
  if(['comunidad','provincia','grupo-list','grupo-detail'].includes(panel)){
    fetchEstructura(true); fetchLocales(true);
  } else if(panel==='seccion-detail'){
    fetchMembresias(true); fetchPerfiles(true); fetchChat(true);
  } else if(panel==='personal'){
    fetchPerfiles(true);
  }
  render();
}
/* Refresco MANUAL: nada se actualiza solo por tiempo.
   /* Refresco MANUAL: nada se actualiza solo por tiempo.
   - Al abrir la app (F5 o al cargar): una carga inicial.
   - Al volver al corcho o cambiar de pestaña en el corcho: recarga notas.
   - Al entrar en un panel: recarga lo de esa pantalla. */
async function refrescarTodo(){
  await Promise.allSettled([
    fetchSharedState(true),
    fetchNotas(true),
    fetchInscripciones(true),
    fetchAdjuntos(true),
    fetchPerfiles(true),
    fetchChat(true),
    fetchMembresias(true),
    fetchEstructura(true),
    fetchLocales(true),
  ]);
  render();
}

function startSync(){
  // 1) Marca como conectado INMEDIATAMENTE (sin esperar nada)
  state.syncStatus = {ok: true, msg: 'Conectado'};

  // 2) Carga solo lo esencial para pintar el corcho rápido
  //    (estas dos se ejecutan en paralelo y son las que el usuario ve primero)
  fetchNotas();
  fetchPerfiles();

  // 3) El resto, en segundo plano y con prioridad más baja.
  //    Cargamos solo lo que NO se ha cargado ya, con un pequeño delay
  //    para no saturar la red justo al arrancar.
  setTimeout(()=>{
    fetchInscripciones();
    fetchAdjuntos();
    fetchChat();
    fetchMembresias();
    fetchEstructura();
    fetchLocales();
    fetchMensajesDirectos();
  }, 300);

  // Sondeo de mensajes directos: cada 4s revisa mensajes nuevos / no leídos.
  if(dmPollTimer) clearInterval(dmPollTimer);
  dmPollTimer = setInterval(()=>{ fetchMensajesDirectos(true); }, 4000);
}function render(){
  destroyLeafletMap(); // limpiar el mapa ANTES de que el DOM que lo contiene desaparezca
  const root = document.getElementById('root');
  root.innerHTML = state.loggedIn ? renderApp() : renderLogin();
  attachHandlers();
  mountMapIfNeeded();
}

        <div class="notif-item ${x.leida ? '' : 'no-leida'}">
          <div class="ni-tit">${esc(x.titulo)}</div>
          <div class="ni-cuerpo">${esc(x.cuerpo)}</div>
          <div class="ni-fecha">${formatearFechaHoraNotif(x.fecha)}</div>
        </div>`).join('')}
  </div>`;
}

/* Fecha legible y corta para el menú de avisos. */
function formatearFechaHoraNotif(iso){
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${dd}/${mm} · ${hh}:${mi}`;
  }catch(e){ return ''; }
}
 
function renderAscensorMenu(){
  const pisos = misPisos();
  if(pisos.length === 0) return '';

  const orden = { grupo:0, ejecutiva:1, guilda:2 };
  const ordenados = pisos.slice().sort((a,b)=>(orden[a.tipo]??9)-(orden[b.tipo]??9));

  // Guardamos los pisos ordenados en window para que el handler los consulte
  window.__pisosAscensor = ordenados;

  const itemHtml = (p, idx) => {
    const activo = state.grupo && state.grupo.nombre === p.grupo
      && ((p.tipo==='grupo' && !state.seccion)
       || (p.tipo==='ejecutiva' && state.seccion==='Ejecutiva')
       || (p.tipo==='guilda' && state.seccion===p.seccion));
    return `<div class="ascensor-item ${activo?'actual':''}" data-piso-idx="${idx}">
      <span class="ic">${p.icono}</span>
      <div>
        <div class="nom">${p.label}</div>
        <div class="sub">${p.sublabel}</div>
      </div>
    </div>`;
  };

  let html = '';
  let idx = 0;
  const grupos = ordenados.filter(p=>p.tipo==='grupo');
  const ejecutivas = ordenados.filter(p=>p.tipo==='ejecutiva');
  const guildas = ordenados.filter(p=>p.tipo==='guilda');

  if(grupos.length){
    html += `<div class="asc-head">Mi Grupo</div>`;
    grupos.forEach(p => { html += itemHtml(p, idx); idx++; });
  }
  if(ejecutivas.length){
    html += `<div class="asc-head">Ejecutivas</div>`;
    ejecutivas.forEach(p => { html += itemHtml(p, idx); idx++; });
  }
  if(guildas.length){
    html += `<div class="asc-head">Guildas</div>`;
    guildas.forEach(p => { html += itemHtml(p, idx); idx++; });
  }

  return `<div class="ascensor-menu" id="ascensor-menu">${html}</div>`;
}
/* Devuelve true si el usuario actual puede promocionar a otro.
   `rolActual` = rol del que quieres promocionar
   `grupo` = grupo al que pertenece el promocionado */
function puedePromocionarA(miRol, rolActual, grupo){
  // Miembros no pueden promocionar a nadie
  if(miRol === 'miembro') return false;

  // No te puedes promocionar a ti mismo (por ahora)
  // (esto se comprobará al final, en el handler)
  
  // Hermes: todo menos ejecutiva_nacional
  if(miRol === 'hermes') return rolActual !== 'ejecutiva_nacional';

  // Ejecutiva Nacional: menos nacional y hermes
  if(miRol === 'ejecutiva_nacional'){
    return !['ejecutiva_nacional','hermes'].includes(rolActual);
  }

  // Ejecutiva de Comunidad: menos nacional, hermes y ejecutiva_comunidad
  if(miRol === 'ejecutiva_comunidad'){
    return !['ejecutiva_nacional','hermes','ejecutiva_comunidad'].includes(rolActual);
  }

  // Presidente de Grupo: solo miembros de SU grupo
  if(miRol === 'presidente_grupo'){
    const hc = homeCtx();
    return grupo === hc.grupo && ['miembro','coordinador_guilda'].includes(rolActual);
  }

  // Coordinador de Guilda: solo miembros de su guilda
  if(miRol === 'coordinador_guilda'){
    return rolActual === 'miembro';
  }

  return false;
}

/* Orden jerárquico de los roles (de abajo a arriba). Se usa para calcular
   a qué roles puede mover el usuario actual a otra persona. */
const ROLE_RANK = {
  miembro: 0,
  coordinador_guilda: 1,
  presidente_grupo: 2,
  ejecutiva_comunidad: 3,
  ejecutiva_nacional: 4,
  hermes: 5,
};
/* Guildas que coordina el usuario actual (sus filas de membresía tipo 'guilda'). */
function misGuildasCoordinadas(){
  const myPerfilId = state.authUser ? state.authUser.id : null;
  if(!myPerfilId) return [];
  return state.membresias
    .filter(m => m.tipo === 'guilda' && m.seccion && String(m.perfil_id) === String(myPerfilId))
    .map(m => m.grupo + '||' + m.seccion);
}
/* True si `targetId` pertenece a alguna guilda que coordina el usuario actual. */
function miembroDeMiGuilda(targetId){
  if(!targetId) return false;
  const mis = misGuildasCoordinadas();
  if(!mis.length) return false;
  return state.membresias.some(m =>
    m.tipo === 'guilda' && m.seccion
    && String(m.perfil_id) === String(targetId)
    && mis.includes(m.grupo + '||' + m.seccion)
  );
}
/* Roles a los que `miRol` puede mover a una persona de rol `rolActual`, grupo
   `grupo` y perfil `targetId`. Ordena de mayor a menor rango. Aplica las reglas
   de territorio de puedePromocionarA y añade la comprobación de guilda del
   coordinador. */
function rolesParaPromocion(miRol, rolActual, grupo, targetId){
  if(!puedePromocionarA(miRol, rolActual, grupo)) return [];

  // Coordinador de Guilda: solo sube a coordinador a los miembros de SU guilda.
  if(miRol === 'coordinador_guilda'){
    if(rolActual !== 'miembro') return [];
    return miembroDeMiGuilda(targetId) ? ['coordinador_guilda'] : [];
  }

  // El resto: cualquier rol estrictamente por debajo del suyo, salvo el actual.
  const miRango = ROLE_RANK[miRol] ?? -1;
  return Object.keys(ROLE_RANK)
    .filter(r => (ROLE_RANK[r] ?? 99) < miRango && r !== rolActual)
    .sort((a,b) => (ROLE_RANK[b] ?? 0) - (ROLE_RANK[a] ?? 0));
}

/* Abre la carta de un usuario concreto. `identificador` puede ser:
   - el UUID del perfil (cuenta real)
   - el nombre (cuenta fantasma sin perfil) */
function abrirCartaUsuario(identificador){
  // Buscar el perfil real
  const perfil = state.perfiles.find(p => String(p.id) === String(identificador));
  // Buscar la membresía si es una cuenta fantasma
  const membresia = state.membresias.find(m => String(m.id) === String(identificador));

  if(!perfil && !membresia){
    showToast('No se encontró esa persona');
    return;
  }

  state.cartaUsuarioId = identificador;
  state.modal = 'cartaUsuario';
  render();
}
/* Devuelve true si el usuario actual puede editar/eliminar esta nota.
   Reglas v3.9:
   - El AUTOR puede editar su nota mientras siga en el circuito (pendiente o
     rechazada), para poder corregirla y reenviarla.
   - Hermes y las ejecutivas (nacional / de comunidad) pueden editar cualquier
     nota que les corresponda por territorio.
   - Una nota ya publicada por su autor solo la tocan los administradores. */
function puedeEditarNota(n){
  const rol = currentRole();
  const esAdmin = rol === 'hermes' || rol === 'ejecutiva_nacional';
  if(esAdmin) return true;

  const esAutor = esAutorDeNota(n);
  if(esAutor){
    // Mientras no esté publicada, el autor manda sobre su propia nota.
    if(notaNoPublicada(n)) return true;
    return false;
  }

  // La ejecutiva de comunidad puede editar notas de su comunidad.
  if(rol === 'ejecutiva_comunidad'){
    if(notaNoPublicada(n)) return true;
    const hc = homeCtx();
    if(!hc.comunidad) return true;
    return hc.comunidad === n.origenComunidad;
  }
  return false;
}

/* Convierte "2026-11-15" a "15/11/2026" */
function formatearFecha(fecha){
  if(!fecha) return '';
  const m = String(fecha).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  return fecha;
}

/* Genera los chips de "editada" (ej. 📍 ⚠ Lugar). */
function renderAvisoEdicion(n){
  if(!n.editada || !Array.isArray(n.historial_ediciones) || n.historial_ediciones.length === 0){
    return '';
  }
  const ultima = n.historial_ediciones[n.historial_ediciones.length - 1];
  if(!ultima.cambios || !Array.isArray(ultima.cambios)) return '';

  const iconos = {
    lugar: '📍', fecha: '📅', hora: '🕐',
    titulo: '📝', msg: '📝', adjuntos: '📎',
    tipo: '🏷️', alcance: '👥'
  };
  const etiquetas = {
    lugar: 'Lugar', fecha: 'Fecha', hora: 'Hora',
    titulo: 'Título', msg: 'Mensaje', adjuntos: 'Adjuntos',
    tipo: 'Tipo', alcance: 'Alcance'
  };
  const chips = ultima.cambios
    .filter(c => iconos[c])
    .map(c => `<span class="edit-chip">${iconos[c]}<span class="excl">⚠</span>${etiquetas[c]}</span>`)
    .join('');
  return `<div class="nota-editada-aviso">${chips}</div>`;
}

/* Trunca un texto a N caracteres, cortando por el último espacio antes del límite. */
function truncarTexto(texto, limite){
  if(!texto) return { texto:'', cortado:false };
  const t = String(texto);
  if(t.length <= limite) return { texto:t, cortado:false };
  const recorte = t.slice(0, limite);
  const ultimoEspacio = recorte.lastIndexOf(' ');
  const corte = ultimoEspacio > limite * 0.6 ? ultimoEspacio : limite;
  return { texto: t.slice(0, corte) + '...', cortado:true };
}

/* ¿Esta nota pasó ya el circuito de aprobación (o es de las antiguas)? */
function notaEsPublica(n){
  if(!n) return false;
  if(n.estado) return n.estado === 'aprobada';
  return !n.pendiente;
}

/* Un poco de contexto extra para la ficha de cada propuesta. */
function detalleAutorNota(n){
  const partes = [];
  if(n.origenGuilda) partes.push('Guilda: ' + n.origenGuilda);
  else if(n.origenGrupo) partes.push(n.origenGrupo);
  else if(n.origenProvincia) partes.push(n.origenProvincia);
  else if(n.origenComunidad) partes.push(n.origenComunidad);
  return partes.join(' · ');
}

/* Etiqueta corta del estado de una propuesta. */
function estadoLabelPropuesta(n){
  if(!n.estado) return n.pendiente ? 'Pendiente' : 'Aprobada';
  if(n.estado === 'pendiente') return 'Pendiente de aprobación';
  if(n.estado === 'rechazada') return 'Rechazada';
  return 'Aprobada';
}

/* Aviso visual del estado + canal + autor dentro de la nota. */
function renderEstadoNota(n){
  const nivel = Number(n.nivelAlcance);
  const alcance = (Number.isFinite(nivel) && NIVEL_LABELS[nivel]) ? NIVEL_LABELS[nivel] : 'General';

  // Badge libre que ya traiga la nota (p. ej. "FIS +10" en las actividades).
  const badgeLibre = n.badge ? `<div class="nb nb-alcance">${esc(n.badge)}</div>` : '';

  // Estado dentro de la cadena de aprobación.
  const estado = n.estado === 'pendiente'
    ? '<div class="nb nb-pendiente">⏳ PENDIENTE</div>'
    : n.estado === 'rechazada'
      ? '<div class="nb nb-rechazada">⛔ RECHAZADA</div>'
      : '';

  // Quién la escribió: usamos el ROL DEL AUTOR (no el de quien está mirando).
  const rolAutor = n.autorRol || currentRole();
  const badgeRol = `<div class="nb" style="background:${ROLE_COLOR[rolAutor] || '#3F3F46'};">✍️ ${esc(ROLE_SHORT[rolAutor] || 'NOTA')}</div>`;

  const canal = n.canalDirectiva === true
    ? '<div class="nb nb-directiva">⚜️ SOLO DIRECTIVA</div>'
    : '<div class="nb nb-miembros">👥 MIEMBROS</div>';
  const alc = `<div class="nb nb-alcance">📍 ${esc(String(alcance).toUpperCase())}</div>`;

  // Si el cambio no llegó a guardarse en la nube, lo decimos bien claro.
  const sinGuardar = n._syncPendiente
    ? '<div class="nb" style="background:#B91C1C;">⚠ SIN GUARDAR</div>'
    : '';

  return `<div class="nota-badges">${badgeLibre}${sinGuardar}${estado}${badgeRol}${canal}${alc}</div>`;
}

/* Ficha de una propuesta dentro de los cajones de aprobaciones / mis propuestas. */
function renderPropuestaItem(n){

/* Cajón superior: lo que TÚ tienes que aprobar y tus propias propuestas. */

/* Filtro por pestaña del corcho. */
function notasDeTabCorcho(tab){
  const publicas = state.notas.filter(notaEsPublica);
  if(tab === 'apro') return propuestasPorAprobar();
  if(tab === 'mias') return misPropuestas();
  if(tab === 'avisos') return publicas.filter(n=> n.tipo==='aviso');
  if(tab === 'eventos') return publicas.filter(n=> n.tipo==='evento');
  if(tab === 'actividades') return publicas.filter(n=> n.tipo==='actividad');
  if(tab === 'historial') return [];
  // 'todo': lo público visible + tus propias propuestas sin publicar.
  return state.notas.filter(n => (notaEsPublica(n) && notaVisibleParaSesion(n)) || (!notaEsPublica(n) && esAutorDeNota(n)));
}

/* Pestañas del corcho, con el contador de aprobaciones pendientes. */
function renderTabsCorcho(){
  const nPorAprobar = propuestasPorAprobar().length;
  let tabs = TABS_CORCHO.slice();
  if(nPorAprobar > 0 || state.corchoTab === 'apro'){
    tabs.push({k:'apro', l:'Aprobaciones', i:'🛡️'});
  }
  if(misPropuestas().length > 0 || state.corchoTab === 'mias'){
    tabs.push({k:'mias', l:'Mis propuestas', i:'✍️'});

  return tabs.map(t=>{
    const alerta = t.k === 'apro' && nPorAprobar > 0;
    const contador = alerta ? `<span class="tab-n">${nPorAprobar}</span>` : '';
    return `<button data-corcho="${t.k}" class="${state.corchoTab===t.k?'active':''}${alerta?' tab-pill-alerta':''}">${t.i} ${t.l}${contador}</button>`;
  }).join('');
}

/* ============================================================
   CALENDARIO PERSONAL
   Widget que aparece debajo del panel derecho. Muestra un mes
   con los días que tienen actividades/eventos con fecha.
   ============================================================ */

/* Estado del calendario (mes y año que se está viendo, día seleccionado) */
function calMesActual(){
  if(state.calMes === null || state.calMes === undefined) state.calMes = new Date().getMonth();
  if(state.calAnio === null || state.calAnio === undefined) state.calAnio = new Date().getFullYear();
  return { mes: state.calMes, anio: state.calAnio };
}
/* Devuelve los eventos visibles para el usuario que tienen fecha en el mes actual. */
function eventosDelMesActual(){
  const { mes, anio } = calMesActual();
  return state.notas.filter(n => {
    if(!n.fecha) return false;
    if(!notaVisibleParaSesion(n)) return false;
    const m = String(n.fecha).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) return false;
    const y = parseInt(m[1], 10);
    const mo = parseInt(m[2], 10) - 1;
    return y === anio && mo === mes;
  });
}

/* Devuelve los eventos de un día concreto (formato dd, mes actual). */
function eventosDelDia(dia){
  const { mes, anio } = calMesActual();
  const fechaStr = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
  return eventosDelMesActual().filter(n => n.fecha === fechaStr);
}

/* Nombre del mes en español */
function nombreMes(mes){
  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return nombres[mes] || '';
}

/* Genera el HTML del calendario. */
function renderCalendario(){
  const { mes, anio } = calMesActual();
  const hoy = new Date();
  const esMesActual = (hoy.getFullYear() === anio && hoy.getMonth() === mes);
  const diaHoy = hoy.getDate();

  // Primer día del mes (0=domingo, 1=lunes...). Convertimos a L=0..D=6.
  const primerDia = new Date(anio, mes, 1).getDay();
  const offset = (primerDia === 0 ? 6 : primerDia - 1); // lunes = 0

  // Días del mes
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  const diasMesAnterior = new Date(anio, mes, 0).getDate();

  // Construir celdas (42 = 6 filas x 7 días, siempre llena)
  const totalCeldas = 42;
  const celdas = [];

  for(let i = 0; i < totalCeldas; i++){
    const numDia = i - offset + 1;
    if(numDia < 1){
      // Día del mes anterior
      celdas.push({ tipo:'antes', num: diasMesAnterior + numDia });
    } else if(numDia > diasEnMes){
      // Día del mes siguiente
      celdas.push({ tipo:'despues', num: numDia - diasEnMes });
    } else {
      // Día del mes actual
      const eventos = eventosDelDia(numDia);
      const apuntados = eventos.filter(e => estaApuntado(e.id)).length;
      const esHoy = esMesActual && numDia === diaHoy;
      const seleccionado = state.calDiaSel === numDia;
      celdas.push({
        tipo:'actual', num: numDia,
        totalEventos: eventos.length,
        apuntados,
        esHoy,
        seleccionado,
      });
    }
  }

  // Día seleccionado por defecto: hoy (si estamos en el mes actual) o ninguno
  let diaSel = state.calDiaSel;
  if(diaSel == null && esMesActual) diaSel = diaHoy;
  const eventosDiaSel = (diaSel && diaSel >= 1 && diaSel <= diasEnMes) ? eventosDelDia(diaSel) : [];

  return `
  <div class="calendario-wrap">
    <div class="cal-head">
      <div class="cal-titulo">📅 ${nombreMes(mes)} ${anio}</div>
      <div class="cal-nav">
          <button data-cal-mes="-1" title="Mes anterior">‹</button>
        <button data-cal-mes="1" title="Mes siguiente">›</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-dia-sem">L</div>
      <div class="cal-dia-sem">M</div>
      <div class="cal-dia-sem">X</div>
      <div class="cal-dia-sem">J</div>
      <div class="cal-dia-sem">V</div>
      <div class="cal-dia-sem">S</div>
      <div class="cal-dia-sem">D</div>
      ${celdas.map(c => {
        if(c.tipo === 'antes' || c.tipo === 'despues'){
          return `<div class="cal-dia vacio otros-meses"><span class="num">${c.num}</span></div>`;
        }
        const clases = ['cal-dia'];
        if(c.totalEventos > 0){
          clases.push('con-eventos');
          if(c.apuntados > 0) clases.push('apuntado');
        }
        if(c.esHoy) clases.push('hoy');
        if(c.seleccionado) clases.push('seleccionado');
        const puntos = [];
        for(let k = 0; k < Math.min(c.totalEventos, 3); k++){
          puntos.push('<span></span>');
        }
        const extra = c.totalEventos > 3 ? `<span class="mas-eventos">+${c.totalEventos - 3}</span>` : '';
        return `<div class="${clases.join(' ')}" data-cal-dia="${c.num}">
          <span class="num">${c.num}</span>
          ${c.totalEventos > 0 ? `<div class="puntos">${puntos.join('')}${extra}</div>` : ''}
        </div>`;
      }).join('')}
    </div>

    ${diaSel ? `
    <div class="cal-eventos-dia">
      <h4>📌 Eventos del día ${diaSel}</h4>
      ${eventosDiaSel.length === 0 ? `<div class="cal-vacio">Sin eventos este día.</div>` :
        eventosDiaSel.map(e => {
          const apuntado = estaApuntado(e.id);
          return `<div class="cal-evento ${apuntado?'apuntado':''}" data-cal-evento="${e.id}">
            <div class="ic">${e.tipo==='evento'?'📅':(e.tipo==='actividad'?'🧭':'📌')}</div>
            <div class="info">
              <b>${e.titulo}</b>
              <span>${e.hora || ''} ${e.lugar ? '· ' + e.lugar : ''}</span>
            </div>
            ${apuntado
              ? `<button class="cta done" disabled>✓ Apuntado</button>`
              : `<button class="cta" data-cal-inscribir="${e.id}">+ Apuntarse</button>`}
          </div>`;
        }).join('')}
    </div>
    ` : ''}
  </div>`;
}

function listaActual(){
  const g = state.grupo.nombre;

  if(state.seccionTipo==='ejecutiva'){ listaVieja = ejecutivaDe(g); tipo='ejecutiva'; addLabel='+ Añadir Cargo'; }
  else if(state.seccionTipo==='miembros'){ listaVieja = miembrosDe(g); tipo='miembros'; addLabel='+ Añadir Scout'; }
  else { listaVieja = guildaMiembrosDe(g, state.seccion); tipo='guilda'; addLabel='+ Añadir Scout'; }

   la pantalla (evita que un 🗑️ a medio pulsar o el scroll salten cada 4s). */
function refrescarListaSuave(){
  const cont = document.getElementById('lista-filas');

    ? puedoGestionarGuilda(g, state.seccion)

    b.onclick = ()=>{

      state.membresias = state.membresias.filter(m=> String(m.id)!==String(id));

  }

  if(!state.rolesDisponiblesPromocion.length){
    return `

        </div>

  }

  const opciones = state.rolesDisponiblesPromocion
    .map(r => `<option value="${r}">${ROLE_LABELS[r] || r}</option>`).join('');

  return `

/* Guarda el nuevo rol elegido en el modal de promoción: PATCH a "perfiles" +
   auto-membresías (opción B: la guilda se deduce de la que ya tiene). */
async function guardarPromocion(){
  const id = state.cartaUsuarioId;
  const perfil = state.perfiles.find(p => String(p.id) === String(id));
  if(!perfil){ showToast('No se encontró el perfil'); return; }

  const sel = document.getElementById('promocion-rol-sel');
  if(!sel){ showToast('Elige un rol'); return; }
  const nuevoRol = sel.value;
  if(!nuevoRol || !state.rolesDisponiblesPromocion.includes(nuevoRol)){
    showToast('Ese rol no está permitido'); return;
  }
  const viejoRol = perfil.rol || 'miembro';
  if(nuevoRol === viejoRol){ showToast('Ya tiene ese rol'); return; }

  // Opción B: si pasa a coordinador de guilda, la guilda se deduce de la
  // membresía 'guilda' que ya tenga. Sin ella, no hay guilda que coordinar.
  if(nuevoRol === 'coordinador_guilda'){
    const guildaM = state.membresias.find(m => m.tipo === 'guilda' && m.seccion && String(m.perfil_id) === String(perfil.id));
    if(!guildaM){
      showToast('Aún no pertenece a ninguna guilda; añádela a una guilda antes de promocionarla');
      return;
    }
  }

  // 1) Guardar el nuevo rol en "perfiles".
  try{
    await sbUpdate(SUPABASE_PERFILES_REST, perfil.id, { rol: nuevoRol });
  }catch(e){
    showToast('⚠ No se pudo guardar el rol en la nube');
    return;
  }
  perfil.rol = nuevoRol;
  const pIdx = state.perfiles.findIndex(p => String(p.id) === String(perfil.id));
  if(pIdx !== -1) state.perfiles[pIdx].rol = nuevoRol;

  // 2) Auto-membresías según el rol nuevo.
  const esEjecutiva = r => r === 'ejecutiva_comunidad' || r === 'ejecutiva_nacional';
  if(esEjecutiva(nuevoRol) && !state.membresias.some(m => m.tipo === 'ejecutiva' && String(m.perfil_id) === String(perfil.id))){
    const nueva = { id: Date.now(), tipo: 'ejecutiva', grupo: perfil.grupo || '', seccion: null, perfil_id: perfil.id, nombre_manual: null, cargo: ROLE_LABELS[nuevoRol] || nuevoRol };
    state.membresias.push(nueva);
    insertMembresia(nueva);
  }

  // 3) Al degradar, quitar la membresía del rol que abandona.
  if(esEjecutiva(viejoRol) && !esEjecutiva(nuevoRol)){
    const aQuitar = state.membresias.filter(m => m.tipo === 'ejecutiva' && String(m.perfil_id) === String(perfil.id));
    aQuitar.forEach(m => deleteMembresia(m.id));
    state.membresias = state.membresias.filter(m => !(m.tipo === 'ejecutiva' && String(m.perfil_id) === String(perfil.id)));
  }
  if(viejoRol === 'coordinador_guilda' && nuevoRol !== 'coordinador_guilda'){
    const aQuitar = state.membresias.filter(m => m.tipo === 'guilda' && String(m.perfil_id) === String(perfil.id));
    aQuitar.forEach(m => deleteMembresia(m.id));
    state.membresias = state.membresias.filter(m => !(m.tipo === 'guilda' && String(m.perfil_id) === String(perfil.id)));
  }

  state.modal = 'cartaUsuario';
  render();
  showToast(`Rol actualizado: ${ROLE_LABELS[nuevoRol] || nuevoRol}`);
}
